<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pandora Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }

  /* 게임 오버 화면 */
  #over {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,8,30,0.45), rgba(5,2,10,0.75));
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  #over.show { opacity: 1; pointer-events: auto; }
  #over .card {
    text-align: center;
    padding: clamp(18px, 4vw, 34px) clamp(26px, 6vw, 56px);
    border-radius: 18px;
    background: rgba(18,12,30,0.62);
    border: 1px solid rgba(255,120,235,0.25);
    box-shadow: 0 0 60px rgba(190,70,230,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    transform: translateY(10px) scale(.97);
    transition: transform .35s ease;
  }
  #over.show .card { transform: none; }
  #over h2 {
    margin: 0 0 6px;
    font: 700 clamp(26px, 5vw, 46px)/1.1 "Chakra Petch", "Segoe UI", sans-serif;
    letter-spacing: 2px;
    color: #ffe2fb;
    text-shadow: 0 0 18px rgba(255,95,224,0.6);
  }
  #over p {
    margin: 0 0 clamp(14px, 3vw, 24px);
    font: 500 clamp(14px, 2.2vw, 19px) Inter, system-ui, sans-serif;
    color: rgba(235,225,255,0.8);
  }
  #over p b { font-family: "Chakra Petch", monospace; font-size: 1.35em; color: #7ff3e6; }
  #retry {
    font: 600 clamp(14px, 2vw, 17px) Inter, system-ui, sans-serif;
    letter-spacing: 1px;
    color: #10061a;
    background: linear-gradient(135deg, #7ff3e6, #c98bff);
    border: 0; border-radius: 999px;
    padding: 11px 30px;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(127,243,230,0.3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #retry:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(127,243,230,0.45); }
  #retry:active { transform: translateY(0); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="over">
    <div class="card">
      <h2>게임 오버!</h2>
      <p>기록: <b id="final">0</b>점</p>
      <button id="retry" type="button">다시 하기</button>
    </div>
  </div>
</div>
<script>
// ── 기본 설정 ─────────────────────────────────────────────
const W = 960, H = 540;            // 논리 해상도 (16:9)
const GROUND_Y = 432;              // 지평선(지면 시작)
const RUN_Y = GROUND_Y + 14;       // 캐릭터가 딛고 서는 높이

const canvas = document.getElementById('game');
const mainCtx = canvas.getContext('2d');
let ctx = mainCtx;                 // 그리기 함수들이 쓰는 현재 컨텍스트

// 움직이지 않는 배경은 한 번만 그려 오프스크린 캔버스에 보관
const bg = document.createElement('canvas');
const bgCtx = bg.getContext('2d');

// 시드 고정 난수: 리사이즈해도 별/바위 배치가 그대로 유지됨
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const gauss = r => Math.sqrt(-2 * Math.log(r() || 1e-9)) * Math.cos(2 * Math.PI * r());

function radial(x, y, r0, r1, stops) {
  const g = ctx.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}
function linear(x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}

// ── 판도라 배경 ───────────────────────────────────────────
const HAZE = '#b8a4d0';     // 먼 곳일수록 섞이는 대기색

function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

// 파스텔 노을 하늘
function drawSky() {
  ctx.fillStyle = linear(0, 0, 0, GROUND_Y, [[0, '#1c2150'], [0.35, '#4b4a93'], [0.62, '#9a7cbf'], [0.82, '#e3a9c4'], [1, '#f6cfc6']]);
  ctx.fillRect(0, 0, W, GROUND_Y + 2);

  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = radial(780, 330, 0, 360, [[0, 'rgba(255,200,170,0.35)'], [0.4, 'rgba(255,150,170,0.12)'], [1, 'rgba(0,0,0,0)']]);
  ctx.fillRect(0, 0, W, GROUND_Y);
  // 초저녁 별
  const r = mulberry32(42);
  for (let i = 0; i < 120; i++) {
    const x = r() * W, y = Math.pow(r(), 1.6) * 200, s = 0.4 + r() * 0.8;
    ctx.fillStyle = `rgba(235,235,255,${(0.15 + r() * 0.5) * (1 - y / 200)})`;
    ctx.fillRect(x, y, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// 하늘에 걸린 거대한 가스 행성 + 작은 위성
function drawGasGiant() {
  const x = 300, y = 120, R = 92;
  ctx.save();
  ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = linear(x - R, y - R, x + R, y + R, [[0, '#8fa6d8'], [0.5, '#c9b8e6'], [1, '#f2d4e6']]);
  ctx.fillRect(x - R, y - R, R * 2, R * 2);
  const r = mulberry32(5);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.25);
  for (let i = 0; i < 14; i++) {
    const by = -R + r() * R * 2, bh = 2 + r() * 9;
    ctx.fillStyle = r() < 0.5 ? `rgba(110,120,190,${0.12 + r() * 0.18})` : `rgba(255,235,245,${0.1 + r() * 0.2})`;
    ctx.fillRect(-R - 10, by, R * 2 + 20, bh);
  }
  ctx.restore();
  ctx.fillStyle = radial(x + R * 0.45, y - R * 0.35, R * 0.3, R * 1.5, [[0, 'rgba(30,30,80,0)'], [0.6, 'rgba(30,30,80,0.25)'], [1, 'rgba(25,20,60,0.75)']]);
  ctx.fillRect(x - R, y - R, R * 2, R * 2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(230,220,255,0.25)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, R, -1.2, 0.9); ctx.stroke();

  ctx.fillStyle = radial(436, 70, 1, 12, [[0, 'rgba(255,245,240,0.85)'], [1, 'rgba(180,170,210,0.6)']]);
  ctx.beginPath(); ctx.arc(438, 72, 9, 0, Math.PI * 2); ctx.fill();
}

function drawClouds() {
  const r = mulberry32(21);
  [[0.12, 210, 1], [0.5, 175, 0.8], [0.85, 240, 1.1], [0.3, 290, 1.2], [0.7, 300, 1]].forEach(([fx, cy, sc]) => {
    for (let i = 0; i < 14; i++) {
      const x = fx * W + gauss(r) * 70 * sc, y = cy + gauss(r) * 10 * sc, rad = (18 + r() * 30) * sc;
      ctx.fillStyle = radial(x, y, 0, rad, [[0, 'rgba(255,225,235,0.22)'], [0.6, 'rgba(240,200,225,0.1)'], [1, 'rgba(240,200,225,0)']]);
      ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
  });
}

// 숲에서 솟은 먼 돌기둥 산
function drawPillars() {
  const r = mulberry32(31);
  [[40, 150, 46], [250, 120, 34], [520, 175, 40], [955, 170, 50], [760, 120, 30]].forEach(([x, hgt, w]) => {
    const base = GROUND_Y - 50, top = base - hgt;
    ctx.fillStyle = linear(x - w / 2, 0, x + w / 2, 0, [[0, mixHex('#4a5175', HAZE, 0.5)], [0.7, mixHex('#5d6588', HAZE, 0.55)], [1, mixHex('#8a8fb5', HAZE, 0.5)]]);
    ctx.beginPath();
    ctx.moveTo(x - w * 0.5, base);
    ctx.lineTo(x - w * 0.42, top + 12);
    ctx.quadraticCurveTo(x - w * 0.3, top, x, top - 3);
    ctx.quadraticCurveTo(x + w * 0.35, top, x + w * 0.45, top + 10);
    ctx.lineTo(x + w * 0.55, base);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = mixHex('#3c4262', HAZE, 0.5);
    ctx.lineWidth = 0.8;
    for (let i = 0; i < 4; i++) {
      const sx = x + (r() - 0.5) * w * 0.7;
      ctx.beginPath(); ctx.moveTo(sx, top + 10); ctx.lineTo(sx + (r() - 0.5) * 6, base); ctx.stroke();
    }
    ctx.fillStyle = mixHex('#3e6f5c', HAZE, 0.55);
    for (let i = 0; i < 7; i++) {
      ctx.beginPath(); ctx.arc(x + (r() - 0.5) * w * 0.85, top + 2 - r() * 5, 4 + r() * 5, 0, Math.PI * 2); ctx.fill();
    }
  });
}

// 떠다니는 산: 아래로 뾰족한 바위, 위엔 숲, 덩굴과 폭포
function floatingIsland(x, y, w, h, haze, seed, fall) {
  const r = mulberry32(seed);
  const c = col => mixHex(col, HAZE, haze);
  const left = x - w / 2, n = 14, k = Math.max(0.5, w / 150);

  const bottom = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    bottom.push([left + w * t, y + Math.pow(Math.sin(t * Math.PI), 1.3) * h * (0.75 + r() * 0.45)]);
  }
  ctx.beginPath();
  ctx.moveTo(left, y);
  bottom.forEach(([bx, by]) => ctx.lineTo(bx, by));
  for (let i = n; i >= 0; i--) ctx.lineTo(left + w * i / n, y - 2 - r() * 4);
  ctx.closePath();
  ctx.fillStyle = linear(left, 0, left + w, 0, [[0, c('#3c3f52')], [0.65, c('#6a6c80')], [1, c('#9a96aa')]]);
  ctx.fill();

  // 바위 결
  ctx.strokeStyle = c('#2d2f40');
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 0.8;
  for (let i = 1; i < n; i += 2) {
    const [bx, by] = bottom[i];
    ctx.beginPath(); ctx.moveTo(bx + (r() - 0.5) * 4, y + 3); ctx.lineTo(bx, by - 3); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 늘어진 덩굴
  ctx.strokeStyle = c('#3f7a55');
  ctx.lineWidth = 0.7;
  for (let i = 0; i < w / 8; i++) {
    const [bx, by] = bottom[1 + (r() * (n - 1) | 0)];
    const vx = bx + (r() - 0.5) * 6, len = (6 + r() * 22) * k;
    ctx.beginPath(); ctx.moveTo(vx, by - 4); ctx.quadraticCurveTo(vx + 3, by + len * 0.5, vx - 1, by + len); ctx.stroke();
  }

  // 섬 위의 숲과 우산형 나무
  for (let i = 0; i < w / 5; i++) {
    ctx.fillStyle = c(r() < 0.5 ? '#2f6a4c' : '#3f7d55');
    ctx.beginPath(); ctx.arc(left + 4 + r() * (w - 8), y - 3 - r() * 5 * k, (4 + r() * 6) * k, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < 3; i++) {
    const tx = left + w * (0.2 + r() * 0.6), th = (10 + r() * 16) * k;
    ctx.strokeStyle = c('#3a3a44');
    ctx.lineWidth = 1.2 * k;
    ctx.beginPath(); ctx.moveTo(tx, y - 4); ctx.lineTo(tx, y - th); ctx.stroke();
    ctx.fillStyle = c('#2c6a50');
    ctx.beginPath(); ctx.ellipse(tx, y - th, 9 * k, 3 * k, 0, 0, Math.PI * 2); ctx.fill();
  }

  if (fall) {
    const fx = left + w * fall, len = 150 + h;
    ctx.fillStyle = linear(0, y, 0, y + len, [[0, 'rgba(240,245,255,0.75)'], [0.7, 'rgba(240,245,255,0.3)'], [1, 'rgba(240,245,255,0)']]);
    ctx.fillRect(fx - 2 * k, y - 4, 4 * k, len);
    ctx.fillStyle = radial(fx, y + len * 0.85, 0, 26, [[0, 'rgba(250,235,250,0.35)'], [1, 'rgba(250,235,250,0)']]);
    ctx.fillRect(fx - 26, y + len * 0.85 - 26, 52, 52);
  }
}

// 거대한 영혼의 나무 (홈트리)
function drawHomeTree() {
  const x = 600, base = GROUND_Y - 30, haze = 0.42;
  const c = col => mixHex(col, HAZE, haze);
  const r = mulberry32(77);

  // 줄기: 뿌리 기둥들이 엉켜 넓게 퍼짐
  ctx.fillStyle = linear(x - 60, 0, x + 60, 0, [[0, c('#2c3048')], [0.6, c('#4a4d68')], [1, c('#6a6a86')]]);
  ctx.beginPath();
  ctx.moveTo(x - 95, base);
  ctx.bezierCurveTo(x - 50, base - 30, x - 40, base - 110, x - 32, 170);
  ctx.lineTo(x + 30, 170);
  ctx.bezierCurveTo(x + 38, base - 110, x + 55, base - 30, x + 105, base);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const t = i / 8, sx = mix(x - 26, x + 24, t), ex = mix(x - 85, x + 95, t);
    ctx.strokeStyle = i % 2 ? c('#252840') : c('#5a5c78');
    ctx.beginPath(); ctx.moveTo(sx, 175); ctx.bezierCurveTo(sx + (r() - 0.5) * 10, 260, mix(sx, ex, 0.4), base - 50, ex, base); ctx.stroke();
  }

  // 굵은 가지
  ctx.strokeStyle = c('#3a3d58');
  ctx.lineCap = 'round';
  [[-1, 160, 8], [1, 150, 7], [-1, 120, 5], [1, 115, 6]].forEach(([d, len, wdt], i) => {
    ctx.lineWidth = wdt;
    ctx.beginPath(); ctx.moveTo(x + d * 10, 190 - i * 12); ctx.quadraticCurveTo(x + d * len * 0.5, 150 - i * 15, x + d * len, 120 - i * 20); ctx.stroke();
  });

  // 우산 모양의 거대한 수관
  for (let i = 0; i < 70; i++) {
    const t = r(), dy = Math.abs(t - 0.5) * 2;
    const cx = x + (t - 0.5) * 340, cy = 95 + dy * dy * 50 + gauss(r) * 14;
    const rx = 18 + r() * 26;
    ctx.fillStyle = c(r() < 0.5 ? '#244a4c' : '#2f5d58');
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, rx * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < 40; i++) {
    const t = r(), dy = Math.abs(t - 0.5) * 2;
    const cx = x + (t - 0.5) * 320, cy = 86 + dy * dy * 50 + gauss(r) * 12;
    const rx = 8 + r() * 14;
    ctx.fillStyle = c('#4f8a78');
    ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, rx * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 수관과 줄기의 생체발광
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 60; i++) {
    const onTrunk = i < 18;
    const px = onTrunk ? x + (r() - 0.5) * 70 : x + (r() - 0.5) * 320;
    const py = onTrunk ? 190 + r() * 180 : 80 + r() * 90;
    const col = r() < 0.65 ? '120,240,255' : '255,120,230', rad = 1.5 + r() * 3;
    ctx.fillStyle = radial(px, py, 0, rad, [[0, `rgba(${col},0.7)`], [1, `rgba(${col},0)`]]);
    ctx.fillRect(px - rad, py - rad, rad * 2, rad * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function canopyLayer(seed, baseY, amp, rMin, rMax, top, bottom) {
  const r = mulberry32(seed);
  ctx.fillStyle = linear(0, baseY - amp - rMax, 0, GROUND_Y, [[0, top], [1, bottom]]);
  ctx.fillRect(0, baseY, W, GROUND_Y - baseY + 2);
  for (let x = -20; x < W + 20;) {
    const rad = rMin + r() * (rMax - rMin);
    ctx.beginPath(); ctx.arc(x, baseY - r() * amp + rad * 0.5, rad, 0, Math.PI * 2); ctx.fill();
    x += rad * (0.8 + r() * 0.5);
  }
}

// 숲 위로 솟은 우산형 나무
function emergentTree(x, baseY, h, crownW, trunk, crown, light) {
  ctx.strokeStyle = trunk;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, baseY); ctx.quadraticCurveTo(x + 4, baseY - h * 0.5, x - 2, baseY - h); ctx.stroke();
  [[0, 1], [-10, 0.75], [-18, 0.5]].forEach(([dy, k]) => {
    ctx.fillStyle = crown;
    ctx.beginPath(); ctx.ellipse(x - 2, baseY - h + dy, crownW * k, crownW * k * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = light;
    ctx.beginPath(); ctx.ellipse(x - 2 + crownW * k * 0.15, baseY - h + dy - crownW * k * 0.08, crownW * k * 0.7, crownW * k * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  });
}

function mist(y0, y1, alpha) {
  ctx.fillStyle = linear(0, y0, 0, y1, [[0, 'rgba(240,205,228,0)'], [1, `rgba(240,205,228,${alpha})`]]);
  ctx.fillRect(0, y0, W, y1 - y0);
}

// 원경 → 근경으로 겹겹이 쌓인 울창한 숲 (층마다 다른 속도로 흘러감)
function drawForestFar() {
  const r = mulberry32(43);
  mist(GROUND_Y - 150, GROUND_Y - 60, 0.45);
  canopyLayer(41, GROUND_Y - 72, 22, 10, 22, mixHex('#5d6f9c', HAZE, 0.35), mixHex('#47577f', HAZE, 0.3));
  for (let i = 0; i < 6; i++) {
    emergentTree(60 + i * 170 + r() * 60, GROUND_Y - 70, 40 + r() * 40, 22 + r() * 14,
      mixHex('#3e4870', HAZE, 0.35), mixHex('#4c6188', HAZE, 0.35), mixHex('#7088ad', HAZE, 0.35));
  }
}

function drawForestMid() {
  const r = mulberry32(45);
  mist(GROUND_Y - 95, GROUND_Y - 40, 0.35);
  canopyLayer(44, GROUND_Y - 42, 22, 12, 26, '#3c6c74', '#22454c');
  for (let i = 0; i < 4; i++) {
    emergentTree(130 + i * 240 + r() * 80, GROUND_Y - 40, 50 + r() * 40, 28 + r() * 16, '#1e3236', '#2d5a5a', '#4d8a7e');
  }
}

function drawForestNear() {
  const r = mulberry32(46);
  mist(GROUND_Y - 60, GROUND_Y - 14, 0.18);
  canopyLayer(47, GROUND_Y - 14, 16, 9, 20, '#2a5a48', '#143028');

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = GROUND_Y - 4 - r() * 50;
    const col = r() < 0.6 ? '110,240,255' : '255,120,230', rad = 2 + r() * 4;
    ctx.fillStyle = radial(x, y, 0, rad, [[0, `rgba(${col},0.5)`], [1, `rgba(${col},0)`]]);
    ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawScenery() {
  drawPillars();
  floatingIsland(395, 72, 70, 45, 0.65, 5, 0);
  floatingIsland(360, 262, 55, 32, 0.7, 6, 0.3);
  drawHomeTree();
  floatingIsland(130, 160, 150, 90, 0.35, 3, 0.12);
  floatingIsland(860, 215, 160, 95, 0.3, 4, 0.82);
}

// ── 숲 바닥 ───────────────────────────────────────────────
function fern(x, y, size, color, r) {
  const fronds = 5 + (r() * 3 | 0);
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  for (let i = 0; i < fronds; i++) {
    const a = -Math.PI / 2 + (i / (fronds - 1) - 0.5) * 2.4;
    const len = size * (0.7 + r() * 0.4);
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len * 0.7 + len * 0.15;
    const cx = x + Math.cos(a) * len * 0.5, cy = y + Math.sin(a) * len * 0.7 - len * 0.2;
    ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
    ctx.lineWidth = 0.7;
    for (let t = 0.2; t < 0.95; t += 0.1) {
      const u = 1 - t;
      const px = u * u * x + 2 * u * t * cx + t * t * ex, py = u * u * y + 2 * u * t * cy + t * t * ey;
      const tx = 2 * u * (cx - x) + 2 * t * (ex - cx), ty = 2 * u * (cy - y) + 2 * t * (ey - cy), tl = Math.hypot(tx, ty) || 1;
      const nx = -ty / tl, ny = tx / tl, l = (1 - t) * size * 0.16 + 0.8;
      ctx.beginPath(); ctx.moveTo(px - nx * l, py - ny * l + l * 0.4); ctx.lineTo(px + nx * l, py + ny * l + l * 0.4); ctx.stroke();
    }
  }
}

// 끝이 빛나는 생체발광 식물
function glowPlant(x, y, h, col) {
  ctx.strokeStyle = 'rgba(40,90,80,0.9)';
  ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 2, y - h * 0.5, x + 1, y - h); ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = radial(x + 1, y - h, 0, 8, [[0, `rgba(${col},0.55)`], [1, `rgba(${col},0)`]]);
  ctx.fillRect(x - 7, y - h - 8, 16, 16);
  ctx.fillStyle = radial(x, y, 0, 6, [[0, `rgba(${col},0.25)`], [1, `rgba(${col},0)`]]);
  ctx.fillRect(x - 6, y - 6, 12, 12);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgb(${col})`;
  ctx.beginPath(); ctx.arc(x + 1, y - h, 1.5, 0, Math.PI * 2); ctx.fill();
}

// 화면 모서리의 커다란 잎 실루엣
function bigLeaf(x, y, len, ang, w) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.45, -w, len, 0);
  ctx.quadraticCurveTo(len * 0.45, w, 0, 0);
  ctx.fillStyle = linear(0, -w, 0, w, [[0, '#14352a'], [1, '#06140e']]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(140,230,190,0.18)';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(2, 0); ctx.quadraticCurveTo(len * 0.5, -1.5, len - 4, 0); ctx.stroke();
  for (let t = 0.15; t < 0.9; t += 0.12) {
    ctx.beginPath(); ctx.moveTo(len * t, -0.5); ctx.lineTo(len * t + w * 0.5, -w * 0.55 * (1 - Math.abs(t - 0.45))); ctx.stroke();
  }
  ctx.restore();
}

function drawGround() {
  const depth = H - GROUND_Y;
  ctx.fillStyle = linear(0, GROUND_Y, 0, H, [[0, '#2f6040'], [0.18, '#204632'], [0.6, '#122a20'], [1, '#07130d']]);
  ctx.fillRect(0, GROUND_Y, W, depth);
  ctx.fillStyle = linear(0, GROUND_Y, 0, GROUND_Y + 12, [[0, 'rgba(180,240,170,0.3)'], [1, 'rgba(180,240,170,0)']]);
  ctx.fillRect(0, GROUND_Y, W, 12);

  const r = mulberry32(99);
  // 이끼 질감
  for (let i = 0; i < 1300; i++) {
    const d = Math.pow(r(), 1.3), y = GROUND_Y + 2 + d * (depth - 2), x = r() * W, s = 0.5 + d * 1.6;
    ctx.fillStyle = r() < 0.55 ? `rgba(4,18,10,${0.25 + r() * 0.3})` : `rgba(140,210,130,${0.08 + r() * 0.16})`;
    ctx.fillRect(x, y, s, s * 0.6);
  }

  // 캐릭터가 달리는 흙길: 조약돌·돌멩이가 뚜렷해서 땅이 흘러가는 게 잘 보임
  const trailTop = GROUND_Y + 4, trailBot = GROUND_Y + 24;
  const edge = x => Math.sin(x * Math.PI * 2 * 7 / W) * 2.2 + Math.sin(x * Math.PI * 2 * 17 / W) * 1.2;
  ctx.beginPath();
  ctx.moveTo(0, trailTop + edge(0) * 0.5);
  for (let x = 0; x <= W; x += 6) ctx.lineTo(x, trailTop + edge(x) * 0.5);
  for (let x = W; x >= 0; x -= 6) ctx.lineTo(x, trailBot + edge(x + 300));
  ctx.closePath();
  ctx.fillStyle = linear(0, trailTop, 0, trailBot, [[0, 'rgba(118,96,66,0.9)'], [1, 'rgba(70,56,38,0.85)']]);
  ctx.fill();
  // 바퀴 자국처럼 길게 난 흙결
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 26; i++) {
    const x = r() * W, y = trailTop + 3 + r() * 15, len = 14 + r() * 40;
    ctx.strokeStyle = r() < 0.5 ? 'rgba(40,30,18,0.45)' : 'rgba(190,165,125,0.3)';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y + (r() - 0.5) * 1.5); ctx.stroke();
  }
  // 조약돌
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = trailTop + 2 + r() * 17, rx = 1 + r() * 2.4, ry = rx * (0.55 + r() * 0.2);
    ctx.fillStyle = 'rgba(25,18,10,0.45)';
    ctx.beginPath(); ctx.ellipse(x - 0.6, y + ry * 0.6, rx, ry * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = linear(0, y - ry, 0, y + ry, [[0, r() < 0.5 ? '#b9a88a' : '#9c9a8e'], [1, '#5a4c38']]);
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 이끼 낀 큰 돌
  for (let i = 0; i < 7; i++) {
    const x = r() * W, y = trailBot + 6 + r() * 40, w = 7 + r() * 9, h = w * 0.55;
    ctx.fillStyle = 'rgba(5,15,8,0.5)';
    ctx.beginPath(); ctx.ellipse(x - 2, y + h * 0.5, w * 1.1, h * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = linear(0, y - h, 0, y + h * 0.5, [[0, '#8a8a80'], [1, '#3e3e38']]);
    ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, Math.PI, 0); ctx.quadraticCurveTo(x, y + h * 0.5, x - w, y); ctx.fill();
    ctx.fillStyle = 'rgba(90,170,90,0.75)';
    ctx.beginPath(); ctx.ellipse(x - w * 0.15, y - h * 0.8, w * 0.6, h * 0.3, -0.1, 0, Math.PI * 2); ctx.fill();
  }

  // 땅 위로 드러난 굵은 뿌리
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const y = GROUND_Y + 22 + r() * (depth - 40), x0 = r() * W, len = 120 + r() * 160;
    const wdt = 3 + (y - GROUND_Y) / depth * 5;
    const curve = off => {
      ctx.beginPath();
      ctx.moveTo(x0, y - off);
      ctx.bezierCurveTo(x0 + len * 0.3, y - 8 - off, x0 + len * 0.6, y + 8 - off, x0 + len, y - 2 - off);
    };
    curve(0); ctx.strokeStyle = '#2a2219'; ctx.lineWidth = wdt; ctx.stroke();
    curve(wdt * 0.3); ctx.strokeStyle = 'rgba(190,170,140,0.25)'; ctx.lineWidth = wdt * 0.3; ctx.stroke();
  }

  // 지면 가장자리 풀잎
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 2 + r() * 3) {
    const h = 3 + r() * 7, lean = (r() - 0.5) * 4;
    ctx.strokeStyle = r() < 0.5 ? '#3f7d4e' : '#5a9a5c';
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 3); ctx.quadraticCurveTo(x + lean * 0.3, GROUND_Y + 3 - h * 0.6, x + lean, GROUND_Y + 3 - h); ctx.stroke();
  }

  for (let i = 0; i < 14; i++) {
    const d = r(), y = GROUND_Y + 10 + d * (depth - 25), x = r() * W;
    fern(x, y, 12 + d * 26, r() < 0.5 ? '#3e8a5a' : '#2f7350', r);
  }
  for (let i = 0; i < 22; i++) {
    const d = r(), y = GROUND_Y + 6 + d * (depth - 15), x = r() * W;
    glowPlant(x, y, 6 + d * 16, r() < 0.6 ? '110,240,255' : '255,120,230');
  }

  [[-10, H + 6, 100, -1.15, 16], [-14, H + 4, 80, -0.6, 13], [W + 8, H + 6, 110, -2.0, 17], [W + 12, H, 85, -2.55, 14]]
    .forEach(([x, y, len, ang, w]) => bigLeaf(x, y, len, ang, w));
}

// ── 하늘을 나는 거대한 새 (매 프레임 그림) ─────────────────
const BIRD_COLORS = [
  ['#1d3550', '#2fb5b8', '#f39a3d'],
  ['#2a1d4a', '#8a4fd0', '#ff6fb8'],
  ['#18394a', '#3d8fe0', '#c9f05a'],
  ['#2a0f14', '#c8323c', '#ffb02e'],   // 공격해 오는 거대 새
];
const birds = [
  { x: 260, y: 230, s: 0.9, v: 34, ph: 0, c: 0 },
  { x: 520, y: 180, s: 0.55, v: 22, ph: 1.3, c: 1 },
  { x: 640, y: 215, s: 0.45, v: 20, ph: 2.1, c: 2 },
  { x: 820, y: 290, s: 1.15, v: 46, ph: 0.6, c: 1 },
  { x: 90, y: 300, s: 0.35, v: 15, ph: 2.8, c: 0 },
  { x: 700, y: 135, s: 0.4, v: 18, ph: 1.9, c: 0 },
];

function updateBirds(dt) {
  birds.forEach(b => {
    b.x -= b.v * dt;
    if (b.x < -70) b.x = W + 70;
    b.ph += dt * (7.5 - b.s * 2.5);
  });
}

function drawBird(b) {
  const [body, wing, tip] = BIRD_COLORS[b.c];
  const f = Math.sin(b.ph);
  const ty = -(8 + 26 * f), tx = -14 + 4 * f;

  ctx.save();
  ctx.translate(b.x, b.y + Math.sin(b.ph * 0.23) * 5 - f * 1.5 * b.s);
  ctx.scale(-b.s, b.s);                         // 왼쪽을 향해 날아감
  ctx.globalAlpha = Math.min(1, 0.55 + b.s * 0.4);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const wingShape = (wy, wx) => {
    ctx.beginPath();
    ctx.moveTo(5, -1);
    ctx.quadraticCurveTo(9, wy * 0.35 - 1, 10, wy * 0.6);
    ctx.lineTo(wx, wy);
    ctx.quadraticCurveTo(wx - 2, wy * 0.55, -4, wy * 0.45);
    ctx.quadraticCurveTo(-7, wy * 0.2, -9, 0);
    ctx.closePath();
  };
  const ribs = (wy, wx) => {
    ctx.strokeStyle = 'rgba(10,15,30,0.55)';
    ctx.lineWidth = 0.7;
    [[wx, wy], [-4, wy * 0.45], [-9, 0]].forEach(([ex, ey]) => {
      ctx.beginPath(); ctx.moveTo(10, wy * 0.6); ctx.lineTo(ex, ey); ctx.stroke();
    });
  };

  // 먼 쪽 날개
  const ty2 = ty * 0.75 - 3, tx2 = tx + 4;
  wingShape(ty2, tx2);
  ctx.fillStyle = linear(5, 0, tx2, ty2, [[0, body], [1, mixHex(tip, body, 0.5)]]);
  ctx.fill();

  // 뒷날개 (작은 두 번째 날개)
  ctx.fillStyle = mixHex(wing, body, 0.3);
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-14, ty * 0.35); ctx.lineTo(-17, 0.5); ctx.closePath(); ctx.fill();

  // 꼬리 + 꼬리 지느러미
  ctx.strokeStyle = body;
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-9, 0); ctx.quadraticCurveTo(-20, 2 + f * 2, -30, -1); ctx.stroke();
  ctx.fillStyle = tip;
  ctx.beginPath(); ctx.moveTo(-29, -1); ctx.lineTo(-33, -4); ctx.lineTo(-36, -1); ctx.lineTo(-33, 2); ctx.closePath(); ctx.fill();

  // 몸통
  ctx.fillStyle = linear(0, -3, 0, 3, [[0, mixHex(wing, body, 0.4)], [1, body]]);
  ctx.beginPath(); ctx.ellipse(0, 0, 11, 3.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = tip;
  ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(-8, 1.5); ctx.lineTo(8, 1.2); ctx.stroke();

  // 목 + 긴 부리 머리 + 볏
  ctx.strokeStyle = body;
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(9, -1); ctx.lineTo(15, -3); ctx.stroke();
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(13, -5); ctx.lineTo(26, -2.5); ctx.lineTo(14, 0.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = tip;
  ctx.beginPath(); ctx.moveTo(15, -4); ctx.lineTo(8, -10); ctx.lineTo(13, -3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe36b';
  ctx.beginPath(); ctx.arc(17.5, -2.8, 0.8, 0, Math.PI * 2); ctx.fill();

  // 가까운 쪽 날개
  wingShape(ty, tx);
  ctx.fillStyle = linear(5, 0, tx, ty, [[0, body], [0.45, wing], [1, tip]]);
  ctx.fill();
  ribs(ty, tx);

  ctx.restore();
}

function drawBirds() {
  birds.forEach(drawBird);
}

// ── 1P 캐릭터: 보라빛 나비족 소녀 ─────────────────────────
const SKIN_L = '#e6d4f5', SKIN = '#bea2dd', SKIN_D = '#9a7bc2', SKIN_DD = '#6b4d95';
const HAIR = '#2a1430', HAIR_D = '#100610', HAIR_PURPLE = '#6f2a88';
const CLOTH = '#2b1a30', CLOTH_D = '#150b17', PANTS = '#30233a', PANTS_D = '#201726';
const LEATHER = '#3b2533', GOLD = '#e4b65e', GOLD_D = '#946628';
const GLOW = '#ff5fe0';

function limb(pts, width, color, hiAlpha) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
  // 오른쪽 위 하이라이트
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x + 1, y - 0.7) : ctx.moveTo(x + 1, y - 0.7)));
  ctx.strokeStyle = `rgba(255,255,255,${hiAlpha})`;
  ctx.lineWidth = width * 0.3;
  ctx.stroke();
}

// 선분 a→b 위 t 지점에 가로로 감기는 띠 (팔찌, 가죽끈, 바지 단)
function band(a, b, t, half, color, w) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
  const nx = -dy / l, ny = dx / l, cx = a[0] + dx * t, cy = a[1] + dy * t;
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx + nx * half, cy + ny * half); ctx.lineTo(cx - nx * half, cy - ny * half); ctx.stroke();
}

// 생체발광 무늬: [x0,y0,x1,y1] 직선 또는 [x0,y0,cx,cy,x1,y1] 곡선
function glowLine(pts, alpha = 0.8, width = 0.6) {
  ctx.save();
  ctx.strokeStyle = `rgba(255,120,235,${alpha})`;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.shadowColor = GLOW; ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  if (pts.length === 6) ctx.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]);
  else ctx.lineTo(pts[2], pts[3]);
  ctx.stroke();
  ctx.restore();
}

function glowDots(dots, r = 0.45) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,155,242,0.95)';
  ctx.shadowColor = GLOW; ctx.shadowBlur = 3;
  dots.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
}

// 금 장식 가시 (머리끝, 귀걸이, 활 끝)
function goldSpike(x, y, ang, size = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(size, size);
  ctx.fillStyle = GOLD_D;
  ctx.fillRect(-1.3, -0.6, 2.6, 1.8);
  ctx.beginPath();
  ctx.moveTo(0, 1);
  ctx.quadraticCurveTo(1.9, 4, 0, 11);
  ctx.quadraticCurveTo(-1.9, 4, 0, 1);
  ctx.fillStyle = linear(-2, 0, 2, 0, [[0, GOLD_D], [0.5, '#ffe3a0'], [1, GOLD]]);
  ctx.fill();
  ctx.restore();
}

// 맨발 + 발목을 감은 검은 천
function foot(x, y, angle, front) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(-3.2, -4);
  ctx.quadraticCurveTo(-4.8, 2.8, -1.5, 3);
  ctx.lineTo(8.5, 3);
  ctx.quadraticCurveTo(11.5, 2.6, 10.5, 0.4);
  ctx.quadraticCurveTo(7.5, -1.5, 3, -3.6);
  ctx.closePath();
  ctx.fillStyle = linear(0, -4, 0, 3, [[0, front ? SKIN : SKIN_D], [1, SKIN_DD]]);
  ctx.fill();
  ctx.lineCap = 'round';
  ctx.strokeStyle = CLOTH_D;
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(-3.6, -2.4); ctx.lineTo(3.4, -2.9); ctx.stroke();
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(-3.4, -0.7); ctx.lineTo(4.4, -1.5); ctx.stroke();
  ctx.restore();
}

// 허벅지는 어두운 바지, 정강이는 피부 위에 검은 천을 칭칭 감음
function leg([hip, knee, ankle], front) {
  limb([knee, ankle], 6.4, front ? SKIN : SKIN_D, front ? 0.25 : 0.08);
  band(knee, ankle, 0.5, 3.6, LEATHER, 1.4);
  band(knee, ankle, 0.67, 3.6, CLOTH_D, 1.4);
  band(knee, ankle, 0.84, 3.5, LEATHER, 1.4);
  limb([hip, knee], 10.5, front ? PANTS : PANTS_D, front ? 0.1 : 0.04);
  band(hip, knee, 1, 5.4, CLOTH_D, 2.4);
  band(hip, knee, 0.97, 5.2, front ? 'rgba(255,95,224,0.45)' : 'rgba(255,95,224,0.2)', 0.6);
}

const bez = (a, b, c, d, t) => {
  const u = 1 - t;
  return [0, 1].map(i => u * u * u * a[i] + 3 * u * u * t * b[i] + 3 * u * t * t * c[i] + t * t * t * d[i]);
};

// 끝에 검은 술이 달린 긴 꼬리
function drawTail(p, lift) {
  const P0 = [-6, -44];
  const P1 = [mix(-22, -24, p), mix(-38, -50, p)];
  const P2 = [mix(-40, -42, p), mix(-12, -60, p)];
  const P3 = [mix(-48, -58, p), mix(-40, -50, p) - lift * 8];
  const N = 28;
  let prev = P0;
  ctx.lineCap = 'round';
  for (let i = 1; i <= N; i++) {
    const t = i / N, pt = bez(P0, P1, P2, P3, t);
    ctx.strokeStyle = SKIN_D;
    ctx.lineWidth = mix(5.2, 1.8, t);
    ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(pt[0], pt[1]); ctx.stroke();
    ctx.strokeStyle = 'rgba(235,215,250,0.4)';
    ctx.lineWidth = mix(1.4, 0.5, t);
    ctx.beginPath(); ctx.moveTo(prev[0] + 0.6, prev[1] - 0.9); ctx.lineTo(pt[0] + 0.6, pt[1] - 0.9); ctx.stroke();
    prev = pt;
  }
  glowDots([0.2, 0.35, 0.5, 0.65].map(t => bez(P0, P1, P2, P3, t)).map(([x, y]) => [x + 0.4, y - 1.2]), 0.5);
  // 꼬리 끝 술
  const q = bez(P0, P1, P2, P3, 0.92);
  const base = Math.atan2(P3[1] - q[1], P3[0] - q[0]);
  for (let i = 0; i < 9; i++) {
    const a = base + (i - 4) * 0.13, len = 8 + (i % 3) * 2.2;
    ctx.strokeStyle = i % 3 === 0 ? HAIR_PURPLE : i % 2 ? HAIR : HAIR_D;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(P3[0] - Math.cos(base) * 3, P3[1] - Math.sin(base) * 3);
    ctx.quadraticCurveTo(
      P3[0] + Math.cos(a) * len * 0.5, P3[1] + Math.sin(a) * len * 0.5 + 1.5,
      P3[0] + Math.cos(a) * len, P3[1] + Math.sin(a) * len);
    ctx.stroke();
  }
}

// 등에 멘 검은 활: 보랏빛으로 빛나는 결 + 금 발톱
function drawBow() {
  const A = [-19, -64], B = [8, 8], C = [-36, -18];
  const path = () => { ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.quadraticCurveTo(C[0], C[1], B[0], B[1]); };
  ctx.strokeStyle = 'rgba(225,200,255,0.4)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  ctx.lineCap = 'round';
  path(); ctx.strokeStyle = '#1b0e1f'; ctx.lineWidth = 3.6; ctx.stroke();
  path(); ctx.strokeStyle = '#3d2346'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.save();
  path();
  ctx.setLineDash([2.5, 3.5]);
  ctx.strokeStyle = 'rgba(255,120,235,0.95)';
  ctx.lineWidth = 0.9;
  ctx.shadowColor = GLOW; ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.restore();
  goldSpike(A[0], A[1], Math.PI - 0.4, 0.85);
  goldSpike(B[0], B[1], -0.4, 0.85);
}

// 어깨에서 흘러내리는 검보라 깃털 망토 (점프하면 뒤로 휘날림)
function drawCape(p, lift) {
  for (let i = 0; i < 16; i++) {
    const t = i / 15;
    const sx = mix(-9, 7, t), sy = -33 - Math.sin(t * Math.PI) * 1.5;
    const ang = Math.PI / 2 + mix(0.25, 0.95, p) + (1 - t) * 0.35 + lift * 0.35 + ((i * 37) % 7 - 3) * 0.025;
    const len = 30 + ((i * 53) % 11) + (1 - t) * 6;
    const ex = sx + Math.cos(ang) * len, ey = sy + Math.sin(ang) * len;
    const nx = -Math.sin(ang), ny = Math.cos(ang), w = 3.4;
    const mx = (sx + ex) / 2, my = (sy + ey) / 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(mx + nx * w, my + ny * w, ex, ey);
    ctx.quadraticCurveTo(mx - nx * w, my - ny * w, sx, sy);
    ctx.fillStyle = i % 3 === 0 ? '#3d1a4c' : i % 3 === 1 ? HAIR : '#261230';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,110,230,0.22)';
    ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  }
}

// 등 뒤로 늘어진 검은 땋은 머리: 낙하할 때는 위로 살짝 떠오름
function drawBraids(lift) {
  const roots = [[-11, -52], [-9, -58], [-6, -63], [-12, -47], [-2, -66], [-8, -55], [-13, -57], [-4, -60]];
  ctx.lineCap = 'round';
  roots.forEach(([rx, ry], i) => {
    const len = 36 + (i % 3) * 6;
    const ex = rx - 5 - i * 1.4 - lift * 16;
    const ey = ry + len * (1 - lift * 0.55);
    const mx = rx - 4 - lift * 6, my = ry + len * 0.55;
    const path = () => { ctx.beginPath(); ctx.moveTo(rx, ry); ctx.quadraticCurveTo(mx, my, ex, ey); };
    const at = t => {
      const u = 1 - t;
      return [u * u * rx + 2 * u * t * mx + t * t * ex, u * u * ry + 2 * u * t * my + t * t * ey];
    };

    path();
    ctx.strokeStyle = i % 3 === 1 ? HAIR_PURPLE : i % 2 ? HAIR_D : HAIR;
    ctx.lineWidth = 3;
    ctx.stroke();
    path();
    ctx.setLineDash([1.6, 1.8]);
    ctx.strokeStyle = 'rgba(200,150,230,0.25)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.setLineDash([]);

    // 금 커프
    ctx.fillStyle = GOLD;
    [0.38, 0.72].forEach(t => { const [bx, by] = at(t); ctx.fillRect(bx - 1.8, by - 1, 3.6, 2); });
    if (i % 3 === 0) goldSpike(ex, ey, lift * 0.9 + 0.1, 0.75);
    else { ctx.beginPath(); ctx.arc(ex, ey, 1.2, 0, Math.PI * 2); ctx.fill(); }
  });
}

// 날카로운 아몬드형 눈 + 짙은 아이라인 (squint: 점프할 때 거만하게 가늘어짐)
function eye(x, y, w, h, squint) {
  const hh = h * (1 - squint * 0.4);
  const shape = () => {
    ctx.beginPath();
    ctx.moveTo(x - w, y + hh * 0.15);
    ctx.quadraticCurveTo(x - w * 0.1, y - hh * 1.25, x + w, y - hh * 0.35);
    ctx.quadraticCurveTo(x + w * 0.1, y + hh * 1.05, x - w, y + hh * 0.15);
    ctx.closePath();
  };
  ctx.save();
  shape();
  ctx.fillStyle = '#f4eaf3';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = radial(x + 0.3, y - 0.1, 0, h * 0.95, [[0, '#ffd27a'], [0.5, '#d0802c'], [1, '#5a2a10']]);
  ctx.beginPath(); ctx.arc(x + 0.3, y - 0.1, h * 0.9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#160808';
  ctx.beginPath(); ctx.ellipse(x + 0.4, y - 0.1, h * 0.25, h * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x + w * 0.35, y - hh * 0.4, h * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(60,20,70,0.35)';                  // 윗눈꺼풀 그늘
  ctx.fillRect(x - w - 1, y - hh * 1.4, w * 2 + 2, hh * 0.7);
  ctx.restore();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#0d050c';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x - w, y + hh * 0.15);
  ctx.quadraticCurveTo(x - w * 0.1, y - hh * 1.25, x + w, y - hh * 0.35);
  ctx.lineTo(x + w + 2.2, y - hh * 0.95);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(13,5,12,0.6)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.6, y + hh * 0.55);
  ctx.quadraticCurveTo(x + w * 0.2, y + hh * 0.95, x + w, y - hh * 0.3);
  ctx.stroke();
}

function sparkle(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#ffe2fb';
  ctx.shadowColor = GLOW; ctx.shadowBlur = 9;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * 0.28 : r;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 두 자세(서 있기 ↔ 점프 따봉) 사이를 p(0~1)로 보간
const mix = (a, b, p) => a + (b - a) * p;
const mixPts = (A, B, p) => A.map((pt, i) => [mix(pt[0], B[i][0], p), mix(pt[1], B[i][1], p)]);

const POSE = {
  stand: {
    backLeg: [[-2, -46], [-9, -26], [-15, -8]], backFoot: [-15, -6, 0.42],
    frontLeg: [[3, -46], [12, -27], [8, -7]], frontFoot: [8, -4, 0],
    lean: 0.12,
    backArm: [[-3, -30], [-11, -18], [-14, -7]],
    frontArm: [[5, -30], [14, -19], [22, -25]],
  },
  jump: {
    backLeg: [[-2, -46], [-12, -34], [-22, -25]], backFoot: [-22, -23, 0.95],
    frontLeg: [[3, -46], [17, -38], [12, -21]], frontFoot: [12, -19, 0.3],
    lean: 0.03,
    backArm: [[-3, -30], [-13, -23], [-21, -32]],
    frontArm: [[5, -30], [20, -29], [29, -41]],
  },
};

// 달리기 사이클: phase(라디안)에 따라 두 다리가 반 박자 어긋나게 휘두르고, 팔은 다리와 반대로 흔듦
function runPose(ph) {
  const leg = (hx, th) => {
    const a = 0.8 * Math.sin(th);                               // 허벅지 앞뒤 스윙
    const bend = 0.15 + 1.6 * Math.max(0, Math.cos(th));        // 앞으로 내딛는 동안 무릎을 접어 올림
    const hip = [hx, -46];
    const knee = [hip[0] + 21 * Math.sin(a), hip[1] + 21 * Math.cos(a)];
    const ankle = [knee[0] + 19 * Math.sin(a - bend), knee[1] + 19 * Math.cos(a - bend)];
    return { pts: [hip, knee, ankle], foot: [ankle[0], ankle[1] + 3, 0.1 + 0.55 * Math.max(0, Math.cos(th))] };
  };
  const arm = (sx, al) => {
    const s = [sx, -30];
    const e = [s[0] + 13 * Math.sin(al), s[1] + 13 * Math.cos(al)];
    const h = [e[0] + 10 * Math.sin(al + 1.5), e[1] + 10 * Math.cos(al + 1.5)];  // 팔꿈치는 90도 가까이 굽힘
    return [s, e, h];
  };
  const f = leg(2, ph), b = leg(-1, ph + Math.PI);
  return {
    frontLeg: f.pts, frontFoot: f.foot,
    backLeg: b.pts, backFoot: b.foot,
    lean: 0.2,
    frontArm: arm(5, -1.05 * Math.sin(ph)),
    backArm: arm(-3, 1.05 * Math.sin(ph)),
  };
}

// 두 자세 객체 전체를 t로 보간 (관절 좌표 배열, 발 [x, y, 각도], 기울기)
function mixPose(A, B, t) {
  const out = {};
  for (const key in A) {
    const a = A[key], b = B[key];
    if (typeof a === 'number') out[key] = mix(a, b, t);
    else if (Array.isArray(a[0])) out[key] = mixPts(a, b, t);
    else out[key] = a.map((v, i) => mix(v, b[i], t));
  }
  return out;
}

function torsoPath() {
  ctx.beginPath();
  ctx.moveTo(-8, 2);
  ctx.bezierCurveTo(-9, -6, -6, -12, -6, -17);
  ctx.bezierCurveTo(-6, -23, -9, -28, -8, -33);
  ctx.quadraticCurveTo(1, -36, 10, -33);
  ctx.bezierCurveTo(13, -28, 13, -21, 8, -17);
  ctx.bezierCurveTo(8, -12, 11, -6, 10, 2);
  ctx.quadraticCurveTo(1, 5, -8, 2);
  ctx.closePath();
}

function headPath() {
  ctx.beginPath();
  ctx.moveTo(7, -37);
  ctx.bezierCurveTo(14, -38, 19, -45, 19, -52);
  ctx.bezierCurveTo(19, -63, 12, -70, 3, -70);
  ctx.bezierCurveTo(-7, -70, -12, -62, -11, -54);
  ctx.bezierCurveTo(-10, -45, -2, -37, 7, -37);
  ctx.closePath();
}

// 허리에서 늘어진 천 조각: 점프하면 뒤로 휘날림
function clothStrip(x, y, len, w, ang, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0);
  ctx.lineTo(w / 2, 0);
  ctx.lineTo(w * 0.4, len);
  ctx.quadraticCurveTo(0, len + 2, -w * 0.4, len);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,120,235,0.2)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([1, 1.4]);
  ctx.beginPath(); ctx.moveTo(-w * 0.3, 1); ctx.lineTo(-w * 0.25, len - 1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawAlien(x, groundY, s, st) {

  const lift = Math.max(Math.max(0, Math.min(1, -st.vy / JUMP_V)) * p, st.sway * (1 - p));

  ctx.closePath(); ctx.fill();
  goldSpike(cx0, cy0 + 1.6, -0.05, 0.42);

  // 길고 뾰족한 귀 (점프하면 쫑긋)
  const tipY = mix(-71, -75, p);
  ctx.beginPath();
  ctx.moveTo(-3, -60);
  ctx.quadraticCurveTo(-12, -64, -20, tipY);
  ctx.quadraticCurveTo(-15, -58, -3, -51);
  ctx.closePath();
  ctx.fillStyle = linear(-20, tipY, -3, -52, [[0, SKIN_D], [1, SKIN]]);
  ctx.fill();
  ctx.strokeStyle = '#d892d0';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(-6, -57.5); ctx.quadraticCurveTo(-12, -62, -17.5, tipY + 2.5); ctx.stroke();
  // 귀에 단 금 고리들 + 가시 귀걸이
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 0.8;
  [[-8, -60.5, 1], [-11.5, -63.5, 0.9], [-5, -50, 1.6]].forEach(([rx, ry, rr]) => {
    ctx.beginPath(); ctx.arc(rx, ry, rr, 0, Math.PI * 2); ctx.stroke();
  });
  goldSpike(-5, -48.4, 0.12 + lift * 0.6, 0.75);

  // 얼굴 옆으로 내려오는 땋은 머리 한 가닥
  const fbx = mix(-1, -4, lift), fby = -38 - lift * 6;
  ctx.lineCap = 'round';
  ctx.strokeStyle = HAIR_D;
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(0, -62); ctx.quadraticCurveTo(-3, -52, fbx, fby); ctx.stroke();
  ctx.setLineDash([1.4, 1.6]);
  ctx.strokeStyle = 'rgba(190,130,225,0.35)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = GOLD;
  ctx.fillRect(-2.9, -51, 3.4, 1.8);
  goldSpike(fbx, fby, lift * 0.8, 0.6);

  // 앞팔: 서 있을 땐 앞으로 굽히고, 점프하면 높이 들어 따봉!
  const THROW_ARM = [[5, -30], [19, -36], [32, -40]];          // 창을 던지며 앞으로 쭉 뻗은 팔
  const frontArm = mixPts(k('frontArm'), THROW_ARM, st.throw);
  limb(frontArm, 6, SKIN, 0.3);
  glowLine([
    mix(frontArm[0][0], frontArm[1][0], 0.15) + 1.2, mix(frontArm[0][1], frontArm[1][1], 0.15) - 1.4,
    mix(frontArm[0][0], frontArm[1][0], 0.5) + 2.2, mix(frontArm[0][1], frontArm[1][1], 0.5) - 0.6,
    mix(frontArm[0][0], frontArm[1][0], 0.8) + 1, mix(frontArm[0][1], frontArm[1][1], 0.8) - 1.2,
  ], 0.7, 0.55);
  band(frontArm[0], frontArm[1], 0.42, 3.6, GOLD, 1.6);
  band(frontArm[1], frontArm[2], 0.12, 3.6, CLOTH_D, 3);
  band(frontArm[1], frontArm[2], 0.6, 3.4, LEATHER, 3.6);
  band(frontArm[1], frontArm[2], 0.4, 3.5, GOLD, 0.6);
  band(frontArm[1], frontArm[2], 0.8, 3.5, GOLD, 0.6);

  // 앞 어깨를 덮는 깃털 견갑
  for (let j = 0; j < 6; j++) {
    const sx = mix(-1, 9, j / 5), sy = -34 + j * 0.3;
    const ang = Math.PI / 2 + 0.15 + j * 0.1 + mix(0, 0.3, p);
    const len = 11 + (j % 3) * 1.6, w = 2.6;
    const ex = sx + Math.cos(ang) * len, ey = sy + Math.sin(ang) * len;
    const nx = -Math.sin(ang), ny = Math.cos(ang), mx = (sx + ex) / 2, my = (sy + ey) / 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(mx + nx * w, my + ny * w, ex, ey);
    ctx.quadraticCurveTo(mx - nx * w, my - ny * w, sx, sy);
    ctx.fillStyle = j % 2 ? '#3d1a4c' : HAIR;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,110,230,0.3)';
    ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  }
  goldSpike(4, -33.5, 0.35, 0.6);

  const [hx, hy] = frontArm[2];
  const tp = p * (1 - st.throw);         // 던지는 순간엔 따봉 대신 손을 펼침
  const fist = mix(3.1, 4.4, tp);
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.roundRect(hx - fist, hy - fist, fist * 2, fist * 2, mix(3.1, 2, tp)); ctx.fill();

  if (tp > 0.01) {
    const p = tp;
    ctx.globalAlpha = p;
    // 말아 쥔 손가락 마디
    ctx.strokeStyle = SKIN_DD;
    ctx.lineWidth = 0.6;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(hx + 0.6, hy - 1.6 + i * 2.1); ctx.lineTo(hx + fist, hy - 1.6 + i * 2.1); ctx.stroke();
    }
    // 위로 치켜든 엄지
    const th = 8 * p;
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.roundRect(hx - fist, hy - fist - th + 1, 3.8, th + 2, 1.9); ctx.fill();
    ctx.strokeStyle = SKIN_DD;
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(hx - fist + 2.3, hy - fist - th + 2.2, 0.7, th - 1.2);
    // 보랏빛 반짝임
    sparkle(hx + 9, hy - 14, 5 * p);
    sparkle(hx + 15, hy - 4, 2.8 * p);
    sparkle(hx - 4, hy - 20, 2.2 * p);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  ctx.restore();
}

// ── 2P 캐릭터: 분홍빛 나비 소녀 ─────────────────────────
// 1P와 함수·상수 이름이 겹치지 않도록 자기만의 범위 안에 두고, 그리기 함수만 꺼내 씀
const drawPinkGirl = (() => {
const SKIN_L = '#ffcadb', SKIN = '#f6a0bf', SKIN_D = '#dc7ea2', SKIN_DD = '#b45a80';
const HAIR = '#5e1e35', HAIR_D = '#34101e', HAIR_PINK = '#c9568a';
const CLOTH = '#53283d', CLOTH_D = '#2f1724', PANTS = '#544850', PANTS_D = '#3a3139';
const LEATHER = '#5b3a2b', GOLD = '#e8bd6a', TAN = '#c9a27a';

function limb(pts, width, color, hiAlpha) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
  // 오른쪽 위 하이라이트
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x + 1, y - 0.7) : ctx.moveTo(x + 1, y - 0.7)));
  ctx.strokeStyle = `rgba(255,255,255,${hiAlpha})`;
  ctx.lineWidth = width * 0.3;
  ctx.stroke();
}

// 선분 a→b 위 t 지점에 가로로 감기는 띠 (팔찌, 가죽끈, 바지 단)
function band(a, b, t, half, color, w) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
  const nx = -dy / l, ny = dx / l, cx = a[0] + dx * t, cy = a[1] + dy * t;
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx + nx * half, cy + ny * half); ctx.lineTo(cx - nx * half, cy - ny * half); ctx.stroke();
}

function feather(x, y, ang, size = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(size, size);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(2.6, 4.5, 0, 10);
  ctx.quadraticCurveTo(-2.6, 4.5, 0, 0);
  ctx.fillStyle = linear(0, 0, 0, 10, [[0, '#f6e6cc'], [0.7, '#d9b48a'], [1, '#7a4f33']]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,70,45,0.6)';
  ctx.lineWidth = 0.45;
  ctx.beginPath(); ctx.moveTo(0, 0.5); ctx.lineTo(0, 9.5); ctx.stroke();
  ctx.restore();
}

// 맨발 + 발목 가죽끈
function foot(x, y, angle, front) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(-3.2, -4);
  ctx.quadraticCurveTo(-4.8, 2.8, -1.5, 3);
  ctx.lineTo(8.5, 3);
  ctx.quadraticCurveTo(11.5, 2.6, 10.5, 0.4);
  ctx.quadraticCurveTo(7.5, -1.5, 3, -3.6);
  ctx.closePath();
  ctx.fillStyle = linear(0, -4, 0, 3, [[0, front ? SKIN : SKIN_D], [1, SKIN_DD]]);
  ctx.fill();
  ctx.lineCap = 'round';
  ctx.strokeStyle = LEATHER;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-3.6, -2.4); ctx.lineTo(3, -2.8); ctx.stroke();
  ctx.strokeStyle = TAN;
  ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-3.4, -0.6); ctx.lineTo(4.6, -1.4); ctx.stroke();
  ctx.restore();
}

// 허벅지는 헐렁한 바지, 정강이는 분홍 피부에 가죽끈
function leg([hip, knee, ankle], front) {
  limb([knee, ankle], 6.4, front ? SKIN : SKIN_D, front ? 0.3 : 0.1);
  band(knee, ankle, 0.62, 3.6, LEATHER, 1.3);
  band(knee, ankle, 0.76, 3.5, TAN, 0.8);
  limb([hip, knee], 10.5, front ? PANTS : PANTS_D, front ? 0.12 : 0.05);
  band(hip, knee, 1, 5.4, front ? CLOTH : CLOTH_D, 2.4);
}

const bez = (a, b, c, d, t) => {
  const u = 1 - t;
  return [0, 1].map(i => u * u * u * a[i] + 3 * u * u * t * b[i] + 3 * u * t * t * c[i] + t * t * t * d[i]);
};

// 끝에 술이 달린 긴 꼬리
function drawTail(p, lift) {
  const P0 = [-6, -44];
  const P1 = [mix(-22, -24, p), mix(-38, -50, p)];
  const P2 = [mix(-40, -42, p), mix(-12, -60, p)];
  const P3 = [mix(-48, -58, p), mix(-40, -50, p) - lift * 8];
  const N = 28;
  let prev = P0;
  ctx.lineCap = 'round';
  for (let i = 1; i <= N; i++) {
    const t = i / N, pt = bez(P0, P1, P2, P3, t);
    ctx.strokeStyle = SKIN_D;
    ctx.lineWidth = mix(5.2, 1.8, t);
    ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(pt[0], pt[1]); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,215,228,0.45)';
    ctx.lineWidth = mix(1.4, 0.5, t);
    ctx.beginPath(); ctx.moveTo(prev[0] + 0.6, prev[1] - 0.9); ctx.lineTo(pt[0] + 0.6, pt[1] - 0.9); ctx.stroke();
    prev = pt;
  }
  // 꼬리 끝 술
  const q = bez(P0, P1, P2, P3, 0.92);
  const base = Math.atan2(P3[1] - q[1], P3[0] - q[0]);
  for (let i = 0; i < 9; i++) {
    const a = base + (i - 4) * 0.13, len = 8 + (i % 3) * 2.2;
    ctx.strokeStyle = i % 3 === 0 ? HAIR_PINK : i % 2 ? HAIR : HAIR_D;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(P3[0] - Math.cos(base) * 3, P3[1] - Math.sin(base) * 3);
    ctx.quadraticCurveTo(
      P3[0] + Math.cos(a) * len * 0.5, P3[1] + Math.sin(a) * len * 0.5 + 1.5,
      P3[0] + Math.cos(a) * len, P3[1] + Math.sin(a) * len);
    ctx.stroke();
  }
}

// 등 뒤로 늘어진 땋은 머리: 낙하할 때는 위로 살짝 떠오름
function drawBraids(lift) {
  const roots = [[-11, -52], [-9, -58], [-6, -62], [-12, -47], [-2, -64], [-8, -55]];
  ctx.lineCap = 'round';
  roots.forEach(([rx, ry], i) => {
    const len = 30 + (i % 3) * 6;
    const ex = rx - 5 - i * 1.6 - lift * 16;
    const ey = ry + len * (1 - lift * 0.55);
    const mx = rx - 4 - lift * 6, my = ry + len * 0.55;
    const path = () => { ctx.beginPath(); ctx.moveTo(rx, ry); ctx.quadraticCurveTo(mx, my, ex, ey); };

    path();
    ctx.strokeStyle = i % 3 === 1 ? HAIR_PINK : i % 2 ? HAIR_D : HAIR;
    ctx.lineWidth = 3;
    ctx.stroke();
    path();
    ctx.setLineDash([1.6, 1.8]);
    ctx.strokeStyle = 'rgba(255,190,215,0.32)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.setLineDash([]);

    // 금색 비즈
    const t = 0.62, u = 1 - t;
    const bx = u * u * rx + 2 * u * t * mx + t * t * ex, by = u * u * ry + 2 * u * t * my + t * t * ey;
    ctx.fillStyle = GOLD;
    ctx.fillRect(bx - 1.8, by - 1, 3.6, 2);
    ctx.beginPath(); ctx.arc(ex, ey, 1.3, 0, Math.PI * 2); ctx.fill();
    if (i === 1 || i === 4) feather(ex, ey + 0.8, lift * 0.9 + 0.1, 0.8);
  });
}

function eye(x, y, rx, ry, wink) {
  if (wink > 0.5) {                           // 따봉할 때 ^ 모양 윙크
    ctx.strokeStyle = HAIR_D;
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - rx, y + 0.6); ctx.quadraticCurveTo(x, y - ry * 0.9, x + rx, y + 0.6); ctx.stroke();
    return;
  }
  ctx.save();
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#fff4f7';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = radial(x + 0.4, y + 0.5, 0, ry * 0.85, [[0, '#ffd889'], [0.45, '#c97a2e'], [1, '#5a2a10']]);
  ctx.beginPath(); ctx.arc(x + 0.4, y + 0.4, ry * 0.82, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0a08';
  ctx.beginPath(); ctx.arc(x + 0.5, y + 0.6, ry * 0.36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x + rx * 0.3, y - ry * 0.32, ry * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(x - rx * 0.3, y + ry * 0.42, ry * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 윗눈꺼풀 + 속눈썹
  ctx.strokeStyle = HAIR_D;
  ctx.lineCap = 'round';
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.ellipse(x, y, rx + 0.2, ry + 0.2, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(x + rx * 0.85, y - ry * 0.55); ctx.lineTo(x + rx + 1.6, y - ry * 0.95); ctx.stroke();
}

function sparkle(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#fff6d8';
  ctx.shadowColor = '#ffd27a'; ctx.shadowBlur = 8;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * 0.28 : r;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 두 자세(서 있기 ↔ 점프 따봉) 사이를 p(0~1)로 보간
const mix = (a, b, p) => a + (b - a) * p;
const mixPts = (A, B, p) => A.map((pt, i) => [mix(pt[0], B[i][0], p), mix(pt[1], B[i][1], p)]);

const POSE = {
  stand: {
    backLeg: [[-2, -46], [-9, -26], [-15, -8]], backFoot: [-15, -6, 0.42],
    frontLeg: [[3, -46], [12, -27], [8, -7]], frontFoot: [8, -4, 0],
    lean: 0.12,
    backArm: [[-3, -30], [-11, -18], [-14, -7]],
    frontArm: [[5, -30], [14, -19], [22, -25]],
  },
  jump: {
    backLeg: [[-2, -46], [-12, -34], [-22, -25]], backFoot: [-22, -23, 0.95],
    frontLeg: [[3, -46], [17, -38], [12, -21]], frontFoot: [12, -19, 0.3],
    lean: 0.03,
    backArm: [[-3, -30], [-13, -23], [-21, -32]],
    frontArm: [[5, -30], [20, -29], [29, -41]],
  },
};

function torsoPath() {
  ctx.beginPath();
  ctx.moveTo(-8, 2);
  ctx.bezierCurveTo(-9, -6, -6, -12, -6, -17);
  ctx.bezierCurveTo(-6, -23, -9, -28, -8, -33);
  ctx.quadraticCurveTo(1, -36, 10, -33);
  ctx.bezierCurveTo(13, -28, 13, -21, 8, -17);
  ctx.bezierCurveTo(8, -12, 11, -6, 10, 2);
  ctx.quadraticCurveTo(1, 5, -8, 2);
  ctx.closePath();
}

function headPath() {
  ctx.beginPath();
  ctx.moveTo(7, -37);
  ctx.bezierCurveTo(14, -38, 19, -45, 19, -52);
  ctx.bezierCurveTo(19, -63, 12, -70, 3, -70);
  ctx.bezierCurveTo(-7, -70, -12, -62, -11, -54);
  ctx.bezierCurveTo(-10, -45, -2, -37, 7, -37);
  ctx.closePath();
}

// 허리에서 늘어진 천 조각: 점프하면 뒤로 휘날림
function clothStrip(x, y, len, w, ang, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0);
  ctx.lineTo(w / 2, 0);
  ctx.lineTo(w * 0.4, len);
  ctx.quadraticCurveTo(0, len + 2, -w * 0.4, len);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,200,0.18)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([1, 1.4]);
  ctx.beginPath(); ctx.moveTo(-w * 0.3, 1); ctx.lineTo(-w * 0.25, len - 1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawAlien(x, groundY, s, st) {
  const p = st.pose;
  const base = st.base;                  // 땅 위 자세 (서 있기 ↔ 달리기 사이클)
  const k = key => mixPts(base[key], POSE.jump[key], p);
  const footAt = key => base[key].map((v, i) => mix(v, POSE.jump[key][i], p));
  // 낙하 중, 그리고 달릴 때 발 구름에 맞춰 머리·꼬리가 살짝 들썩이는 정도
  const lift = Math.max(Math.max(0, Math.min(1, -st.vy / JUMP_V)) * p, st.sway * (1 - p));

  // 그림자: 땅에 남아 있고, 높이 오를수록 작고 옅어짐
  const h = Math.min(st.height / 110, 1);
  ctx.save();
  ctx.translate(x, groundY);
  ctx.scale(s * (1 - h * 0.45), s * 0.18 * (1 - h * 0.45));
  ctx.globalAlpha = 1 - h * 0.6;
  ctx.fillStyle = radial(0, 0, 0, 36, [[0, 'rgba(15,4,0,0.6)'], [1, 'rgba(15,4,0,0)']]);
  ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, groundY - st.height + st.bob * (1 - p));
  ctx.scale(s * st.sx, s * st.sy);

  drawTail(p, lift);

  // 뒷다리 (서 있을 땐 뒤꿈치를 든 출발 자세, 점프 땐 뒤로 접음)
  leg(k('backLeg'), false);
  foot(...footAt('backFoot'), false);
  // 앞다리
  leg(k('frontLeg'), true);
  foot(...footAt('frontFoot'), true);

  // 상체: 골반 기준으로 기울임 (점프 땐 곧게 세움)
  ctx.save();
  ctx.translate(0, -46);
  ctx.rotate(mix(base.lean, POSE.jump.lean, p));

  // 뒷팔
  const backArm = k('backArm');
  limb(backArm, 5.6, SKIN_D, 0.1);
  band(backArm[0], backArm[1], 0.4, 3.4, GOLD, 1.5);
  ctx.fillStyle = SKIN_D;
  ctx.beginPath(); ctx.arc(backArm[2][0], backArm[2][1], 2.9, 0, Math.PI * 2); ctx.fill();

  drawBraids(lift);

  // 뒤쪽 천 조각
  clothStrip(-6, 2, 14, 5.5, mix(0.18, 0.75, p), CLOTH_D);

  // 몸통
  torsoPath();
  ctx.fillStyle = linear(-9, 0, 12, 0, [[0, SKIN_DD], [0.3, SKIN_D], [0.7, SKIN], [1, SKIN_L]]);
  ctx.fill();
  ctx.save();
  torsoPath();
  ctx.clip();
  // 크롭 탑
  ctx.beginPath();
  ctx.moveTo(-12, -36); ctx.lineTo(14, -36); ctx.lineTo(14, -23);

function drawScore(score = 0, best = 0) {
  const pw = 204, ph = 78, px = W - pw - 24, py = 22;

  ctx.save();
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12);
  ctx.fillStyle = 'rgba(10,12,26,0.5)';

  ctx.stroke();

  ctx.fillRect(px + 14, py, pw - 28, 1);

  const left = px + 18, right = px + pw - 18;
  ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';

  // 생체발광 점
  ctx.fillStyle = '#7ff3e6';
  ctx.shadowColor = '#5ff0d0'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(left + 3, py + 21, 2.6, 0, Math.PI * 2); ctx.fill();

  ctx.font = '600 10px Inter, system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(225,228,255,0.6)';
  ctx.fillText('SCORE', left + 12, py + 25);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(225,228,255,0.38)';
  ctx.fillText('BEST ' + String(best).padStart(6, '0'), right + 3, py + 25);

  // 숫자: 앞자리 0은 흐리게
  const digits = String(score).padStart(6, '0');
  const sig = String(score).length;
  ctx.font = '700 32px "Chakra Petch", "Segoe UI", monospace';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
  ctx.fillStyle = 'rgba(246,239,228,0.22)';

  ctx.fillStyle = '#f7efe3';
  ctx.shadowColor = 'rgba(120,240,220,0.5)'; ctx.shadowBlur = 14;
  ctx.fillText(digits.slice(-sig), right + 2, py + 63);
  ctx.restore();
}

function makePlayer(id, x, name, label, color) {

const SPEED_MAX = 2.5;
let state = 'playing';  // 'playing' | 'over'
let score = 0;

// 완만하게 빨라짐: 30초 1.5배, 60초 2배 (최대 2.5배)
function speedMul() {

const overEl = document.getElementById('over');
