// 충돌 판정: 그림보다 작고 관대하게
// 캐릭터는 몸통 중심의 좁은 상자, 꽃은 꽃잎 끝을 뺀 머리 원 + 가는 줄기
// 캐릭터 판정: 그림(폭 약 40, 키 약 120)보다 훨씬 작은 몸통 중심 상자 (폭 11, 머리·발끝 제외)
function playerBox(p) {
  const feet = RUN_Y - p.height;
  return { l: p.x - 5, r: p.x + 6, t: feet - 84, b: feet - 10 };
}

function hitsObstacle(box, o) {
  const s = o.s;
  const sway = Math.sin(time * 2 + o.seed) * 2;
  // 꽃 머리: 그림 반지름 21(+가시 25) → 판정 8
  const hx = o.x + sway * s, hy = RUN_Y + 2 - 34 * s, hr = 8 * s;
  const nx = Math.max(box.l, Math.min(hx, box.r)), ny = Math.max(box.t, Math.min(hy, box.b));
  if ((hx - nx) ** 2 + (hy - ny) ** 2 < hr * hr) return true;
  // 줄기: 폭 ±3, 꽃 머리 바로 아래부터 지면 위쪽까지 (밑잎·가시는 판정 없음)
  const sl = o.x - 3 * s, sr = o.x + 3 * s, st = hy + 6 * s, sb = RUN_Y + 2 - 6 * s;
  return box.l < sr && box.r > sl && box.t < sb && box.b > st;
}

// ── 목숨(하트) ─────────────────────────────────────────────
// 두 캐릭터가 함께 쓰는 하트 3개로 시작. 누구든 부딪히면 하트 1개를 쓰고 잠깐 무적으로 계속 달림.
// 하트가 없을 때 부딪히면 그 캐릭터는 아웃, 두 명 모두 아웃되면 게임 오버.
const START_LIVES = 3;
const MAX_LIVES = 5;
const INV_TIME = 2;      // 하트를 잃은 뒤 무적(깜빡임) 시간
let lives = START_LIVES;
let heartGain = 0;       // 하트를 얻었을 때 우측 상단 하트가 톡 커지는 연출 (1 → 0)
let heartLose = 0;       // 하트를 잃었을 때 흔들리는 연출 (1 → 0)

function hitPlayer(p) {
  if (p.inv > 0) return;
  if (lives > 0) {
    lives--;
    heartLose = 1;
    p.inv = INV_TIME;
    addPopup(p.x, RUN_Y - p.height - 132, `${p.label} -♥`, '#ff5470', 18);
    puff(10, 1, RUN_Y - p.height - 40, p.x);
  } else {
    knockOut(p);
  }
}

function revive(p) {
  p.alive = true;
  p.deadT = 0;
  p.inv = INV_TIME;
  addPopup(p.x, RUN_Y - p.height - 132, `${p.label} 부활!`, p.color, 18);
  puff(14, 1.2, RUN_Y - 50, p.x);
}

// 하트가 없을 때 부딪히면 그 캐릭터만 아웃, 두 명 모두 아웃되면 게임 오버
function knockOut(p) {
  p.alive = false;
  p.deadT = 0.0001;
  addPopup(p.x, RUN_Y - p.height - 132, `${p.label} 아웃!`, p.color, 18);
  puff(12, 1, RUN_Y - p.height - 40, p.x);
  if (players.every(q => !q.alive)) gameOver();
}

function gameOver() {
  state = 'over';
  const final = Math.floor(score);
  if (final > best) {
    best = final;
    try { localStorage.setItem('pandora-runner-best', String(best)); } catch (e) {}
  }
  finalEl.textContent = final;
  overEl.classList.add('show');
}

function restart() {
  state = 'playing';
  score = 0;
  runTime = 0;
  obstacles.length = 0;
  dust.length = 0;
  spawnIn = 1.2;
  players.forEach((p, i) => Object.assign(p, makePlayer(p.id, p.x, p.name, p.label, p.color)));
  enemies.length = 0;
  shots.length = 0;
  popups.length = 0;
  enemyIn = 6;
  items.length = 0;
  lives = START_LIVES;
  heartGain = heartLose = 0;
  overEl.classList.remove('show');
  document.getElementById('retry').blur();
}

document.getElementById('retry').addEventListener('click', restart);

function jump(p) {
  if (state !== 'playing' || !p.alive) return;
  if (p.jumps >= MAX_JUMPS) return;      // 2단 점프까지만, 착지하면 다시 충전
  if (p.jumps === 0) {
    p.vy = JUMP_V;
    puff(6, 0.7, RUN_Y - 1, p.x);
  } else {
    p.vy = JUMP_V2;                       // 떨어지는 중이어도 다시 위로 솟음
    puff(8, 0.6, RUN_Y - p.height, p.x);  // 공중에서 발밑에 이는 빛 가루
  }
  p.jumps++;
  p.onGround = false;
}

function puff(n, power, y, x) {
  for (let i = 0; i < n; i++) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    dust.push({
      x: x + dir * (4 + Math.random() * 10), y,
      vx: dir * (30 + Math.random() * 70) * power, vy: -(20 + Math.random() * 45) * power,
      life: 0, max: 0.45 + Math.random() * 0.35, r: 1.5 + Math.random() * 2.5,
    });
  }
}

function updatePlayer(p, dt, mul) {
  // 아웃되거나 게임 오버면 달리기를 멈추고 서 있는 자세로 부드럽게 돌아감
  const running = state === 'playing' && p.alive;
  p.runAmt += ((running ? 1 : 0) - p.runAmt) * Math.min(1, dt * 8);
  if (state !== 'playing') return;
  if (p.deadT) p.deadT += dt;
  p.cd = Math.max(0, p.cd - dt);
  p.inv = Math.max(0, p.inv - dt);
  p.throwT = Math.max(0, p.throwT - dt * 3.5);

  // 달리기 사이클: 반 바퀴마다 한 발이 땅을 디딤 → 발밑에 작은 흙먼지
  if (running) {
    const prevStep = Math.floor(p.runPh / Math.PI);
    p.runPh += dt * Math.PI * 2 * STRIDE_HZ * Math.pow(mul, 0.6);
    if (p.onGround && Math.floor(p.runPh / Math.PI) !== prevStep) puff(2, 0.35, RUN_Y - 1, p.x);
  }

  if (!p.onGround) {
    p.vy -= GRAVITY * dt;                 // 올라가는 동안 점점 느려지고, 정점 이후 가속하며 낙하
    p.height += p.vy * dt;
    if (p.height <= 0) {
      p.height = 0;
      p.vy = 0;
      p.onGround = true;
      p.jumps = 0;
      p.land = 1;
      puff(10, 1, RUN_Y - 1, p.x);
    }
  }
  // 자세는 부드럽게 전환 (아웃되면 따봉도 내림)
  const target = p.onGround || !p.alive ? 0 : 1;
  p.pose += (target - p.pose) * Math.min(1, dt * (p.onGround ? 12 : 16));
  p.land = Math.max(0, p.land - dt / 0.18);

  if (p.alive && p.inv <= 0) {
    const box = playerBox(p);
    if (obstacles.some(o => hitsObstacle(box, o)) || enemies.some(e => !e.dead && enemyHitsBox(e, box))) hitPlayer(p);
  }
}

function update(dt) {
  time += dt;
  updateBirds(dt);
  const mul = speedMul();
  if (state !== 'playing') {               // 게임 오버면 세상이 멈춤 (새만 계속 날아감)
    players.forEach(p => updatePlayer(p, dt, mul));
    return;
  }

  runTime += dt;
  const v = SCROLL * mul;                  // 땅과 장애물이 함께 흘러가는 속도
  scrollX += v * dt;
  score += SCORE_RATE * mul * dt;          // 빨라질수록 점수도 더 빨리 오름

  updateObstacles(dt, v);
  updateCombat(dt, v);
  updateItems(dt, v);
  heartGain = Math.max(0, heartGain - dt * 1.6);
  heartLose = Math.max(0, heartLose - dt * 2.5);
  players.forEach(p => updatePlayer(p, dt, mul));

  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.life += dt;
    if (d.life >= d.max) { dust.splice(i, 1); continue; }
    const drag = Math.pow(0.05, dt);
    d.vx *= drag; d.vy = d.vy * drag + 30 * dt;
    d.x += (d.vx - v) * dt; d.y += d.vy * dt;   // 흙먼지도 땅과 함께 뒤로 흘러감
  }
}

function drawDust() {
  dust.forEach(d => {
    const t = d.life / d.max;
    ctx.fillStyle = `rgba(170,225,190,${(1 - t) * 0.4})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * (1 + t * 1.2), 0, Math.PI * 2); ctx.fill();
  });
}

// ── 장애물: 뾰족한 가시 꽃 ────────────────────────────────
const SCROLL = 280;     // 장애물이 왼쪽으로 흘러오는 속도 px/s
const FLOWER_COLORS = [
  ['#ff5fae', '#8a1f5c', '255,190,235'],
  ['#9b5cff', '#3c1a7a', '215,185,255'],
  ['#ff7a3c', '#7a2a14', '255,215,150'],
];
const obstacles = [];
let spawnIn = 1.2;
let time = 0;

function spawnObstacle() {
  // 가끔 작거나 크게: 작음 20% · 보통 55% · 큼 25%
  const roll = Math.random();
  const s = roll < 0.2 ? 0.5 + Math.random() * 0.15
    : roll < 0.75 ? 0.75 + Math.random() * 0.25
    : 1.15 + Math.random() * 0.15;
  obstacles.push({
    x: W + 30 * s, s,
    hue: Math.random() * FLOWER_COLORS.length | 0,
    seed: Math.random() * 10,
    spin: Math.random() * Math.PI,
  });
}

function updateObstacles(dt, v) {
  spawnIn -= dt;
  if (spawnIn <= 0) {
    spawnObstacle();
    spawnIn = 0.9 + Math.random() * 1.8;   // 일정하지 않은 랜덤 간격
  }
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= v * dt;
    if (o.x < -30 * o.s - 20) obstacles.splice(i, 1);   // 화면 왼쪽 밖으로 나가면 제거
  }
}

function drawThornFlower(o) {
  const [petal, petalD, core] = FLOWER_COLORS[o.hue];
  const sway = Math.sin(time * 2 + o.seed) * 2;
  const top = -34;

  ctx.save();
  ctx.translate(o.x, RUN_Y + 2);
  ctx.scale(o.s, o.s);

  // 그림자
  ctx.save();
  ctx.scale(1, 0.25);
  ctx.fillStyle = radial(0, 0, 0, 18, [[0, 'rgba(0,10,5,0.5)'], [1, 'rgba(0,10,5,0)']]);
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 톱니처럼 뾰족한 밑잎
  [-1, 1].forEach(d => {
    for (let j = 0; j < 3; j++) {
      ctx.beginPath();
      ctx.moveTo(d * 1.5, 0);
      ctx.lineTo(d * (12 + j * 4), -(4 + j * 6));
      ctx.lineTo(d * 0.5, -3 - j * 2);
      ctx.closePath();
      ctx.fillStyle = linear(0, 0, d * 14, -12, [[0, '#0f2e20'], [1, j % 2 ? '#2d7a4c' : '#1f5a3c']]);
      ctx.fill();
    }
  });

  // 줄기 + 가시
  const cx = sway * 0.5 + 2, cy = top / 2;
  ctx.strokeStyle = '#3d7a4a';
  ctx.lineWidth = 3.6;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(cx, cy, sway, top); ctx.stroke();
  ctx.fillStyle = '#ece0c4';
  [0.25, 0.45, 0.65, 0.82].forEach((t, i) => {
    const u = 1 - t, px = 2 * u * t * cx + t * t * sway, py = 2 * u * t * cy + t * t * top;
    const d = i % 2 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(px, py - 2); ctx.lineTo(px + d * 7, py - 4.5); ctx.lineTo(px, py + 1.5);
    ctx.closePath(); ctx.fill();
  });

  // 꽃: 칼날 같은 꽃잎 두 겹 + 바늘 가시
  ctx.translate(sway, top);
  ctx.rotate(o.spin + Math.sin(time * 1.3 + o.seed) * 0.06);
  // 꽃잎 하나: 안쪽은 넓고 끝은 칼날처럼 뾰족
  const blade = (a, inner, len, spread) => {
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - spread) * inner, Math.sin(a - spread) * inner);
    ctx.quadraticCurveTo(Math.cos(a - spread * 0.4) * len * 0.6, Math.sin(a - spread * 0.4) * len * 0.6, Math.cos(a) * len, Math.sin(a) * len);
    ctx.quadraticCurveTo(Math.cos(a + spread * 0.4) * len * 0.6, Math.sin(a + spread * 0.4) * len * 0.6, Math.cos(a + spread) * inner, Math.sin(a + spread) * inner);
    ctx.closePath();
  };
  ctx.strokeStyle = 'rgba(20,4,20,0.7)';
  ctx.lineWidth = 0.8;
  for (let k = 0; k < 8; k++) {
    blade(k * Math.PI / 4, 4, 21, 0.42);
    ctx.fillStyle = linear(0, 0, Math.cos(k * Math.PI / 4) * 21, Math.sin(k * Math.PI / 4) * 21, [[0, petal], [1, petalD]]);
    ctx.fill();
    ctx.stroke();
  }
  for (let k = 0; k < 8; k++) {
    blade(k * Math.PI / 4 + Math.PI / 8, 3, 14, 0.5);
    ctx.fillStyle = radial(0, 0, 2, 14, [[0, '#fff0f8'], [0.4, petal], [1, petalD]]);
    ctx.fill();
    ctx.stroke();
  }
  // 꽃잎 끝의 바늘 가시
  ctx.strokeStyle = '#f4ead2';
  ctx.lineWidth = 0.9;
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 20, Math.sin(a) * 20); ctx.lineTo(Math.cos(a) * 25, Math.sin(a) * 25); ctx.stroke();
  }

  // 빛나는 꽃술
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = radial(0, 0, 0, 12, [[0, `rgba(${core},0.4)`], [1, `rgba(${core},0)`]]);
  ctx.fillRect(-15, -15, 30, 30);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = radial(0, 0, 0, 4, [[0, '#ffffff'], [1, `rgb(${core})`]]);
  ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(drawThornFlower);
}

// ── 거대 적: 식인 꽃 · 거대 새 (점프로 못 피함 → 1P 창 · 2P 화살로 처치) ──
const ENEMY_HP = 100;
const SHOT_DAMAGE = 50;          // 창이든 화살이든 2번 맞으면 쓰러짐
const KILL_BONUS = 50;
const WEAPONS = {
  spear: { speed: 1000, cooldown: 0.3, gravity: 260 },   // 1P: 묵직한 창
  arrow: { speed: 1200, cooldown: 0.22, gravity: 200 },  // 2P: 빠른 화살
};
const enemies = [];
const shots = [];                // 날아가는 창 · 화살
const popups = [];               // 데미지 숫자 · 처치 보너스
let enemyIn = 6;

function spawnEnemy() {
  if (Math.random() < 0.5) {
    const s = 0.95 + Math.random() * 0.2;
    enemies.push({ type: 'chomper', x: W + 80 * s, s, hp: ENEMY_HP, flash: 0, dead: 0, seed: Math.random() * 10 });
    // 식인 꽃 바로 앞뒤로 가시 꽃이 겹치지 않게
    for (let i = obstacles.length - 1; i >= 0; i--) if (obstacles[i].x > W - 180) obstacles.splice(i, 1);
    spawnIn = Math.max(spawnIn, 1.1);
  } else {
    const s = 2 + Math.random() * 0.4;
    enemies.push({ type: 'bird', x: W + 40 * s, y: 210 + Math.random() * 90, s, hp: ENEMY_HP, flash: 0, dead: 0,
      ph: Math.random() * 6, c: 3, vy: 0, rot: 0 });
  }
}

// 식인 꽃 머리 위치: 천천히 흔들리고, 맞으면 부르르 떨림
function chomperHead(e) {
  const sway = Math.sin(time * 1.6 + e.seed) * 6 + e.flash * 4 * Math.sin(time * 70);
  return { sway, x: e.x + sway * e.s, y: RUN_Y + 2 - 150 * e.s };
}

// 판정 도형 (그림보다 작게): 원 [x, y, r], 상자 [l, t, r, b]
// 식인 꽃: 머리(꽃잎 테 반지름 58, 턱 길이 66) → 턱 안쪽 원 28 + 줄기 아래쪽 곧은 부분 ±5
// 거대 새: 날개·꼬리·부리는 빼고 몸통 원 9배율(약 20)
function enemyShapes(e) {
  if (e.type === 'chomper') {
    const h = chomperHead(e);
    return { circles: [[h.x - 18 * e.s, h.y, 28 * e.s]], rects: [[e.x - 5 * e.s, RUN_Y - 100 * e.s, e.x + 5 * e.s, RUN_Y]] };
  }
  return { circles: [[e.x - 4 * e.s, e.y, 9 * e.s]], rects: [] };
}

function circleHitsBox(cx, cy, r, box) {
  const nx = Math.max(box.l, Math.min(cx, box.r)), ny = Math.max(box.t, Math.min(cy, box.b));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}

function enemyHitsBox(e, box, pad = 0) {
  const sh = enemyShapes(e);
  return sh.circles.some(([cx, cy, r]) => circleHitsBox(cx, cy, r + pad, box))
    || sh.rects.some(([l, t, r, b]) => box.l < r + pad && box.r > l - pad && box.t < b && box.b > t - pad);
}

// 1P는 창, 2P는 화살을 (tx, ty) 쪽으로 발사 (뒤쪽으로는 못 쏨)
function shoot(p, tx, ty) {
  if (state !== 'playing' || !p.alive || p.cd > 0) return;
  const kind = p.id === 0 ? 'spear' : 'arrow';
  const wpn = WEAPONS[kind];
  p.cd = wpn.cooldown;
  const hx = p.x + 20, hy = RUN_Y - p.height - 72;
  let dx = tx - hx;
  const dy = ty - hy;
  if (dx < 40) dx = 40;
  const l = Math.hypot(dx, dy);
  shots.push({ kind, x: hx, y: hy, vx: dx / l * wpn.speed, vy: dy / l * wpn.speed, g: wpn.gravity });
  p.throwT = 1;
}

// 정면으로 발사 (키보드용)
function shootForward(p) {
  shoot(p, W, RUN_Y - p.height - 72);
}

function addPopup(x, y, text, color, size) {
  popups.push({ x, y, text, color, size, life: 0, max: 0.9 });
}

function damage(e, x, y) {
  e.hp -= SHOT_DAMAGE;
  e.flash = 1;
  addPopup(x, y - 8, `-${SHOT_DAMAGE}`, '#ff5470', 20);
  puff(6, 0.8, y, x);
  if (e.hp <= 0) {
    e.dead = 0.0001;
    score += KILL_BONUS;
    addPopup(x, y - 34, `처치! +${KILL_BONUS}`, '#ffd36b', 18);
    puff(12, 1.2, y, x);
    if (Math.random() < ITEM_DROP_CHANCE) items.push({ x, y, t: 0 });   // 목숨 아이템 드롭
  }
}

function updateCombat(dt, v) {
  enemyIn -= dt;
  if (enemyIn <= 0) {
    spawnEnemy();
    enemyIn = 4.5 + Math.random() * 4;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.flash = Math.max(0, e.flash - dt * 4);
    if (e.dead) e.dead += dt;
    if (e.type === 'chomper') {
      e.x -= v * dt;                                   // 땅에 뿌리박혀 함께 흘러옴
    } else {
      e.ph += dt * 5;
      if (e.dead) {                                    // 맞고 떨어짐
        e.vy += 700 * dt; e.y += e.vy * dt; e.x -= v * 0.5 * dt; e.rot += dt * 3;
      } else {
        e.x -= (240 + v * 0.45) * dt;
        // 앞에 있는(먼저 만날) 살아 있는 주인공의 높이를 따라 내려와서 점프로는 피할 수 없음
        const prey = players.filter(p => p.alive && p.x + 30 < e.x).sort((a, b) => b.x - a.x)[0];
        if (prey) e.y += (RUN_Y - prey.height - 58 - e.y) * Math.min(1, dt * 1.8);
      }
    }
    if (e.x < -180 || e.dead > 0.9 || e.y > H + 120) enemies.splice(i, 1);
  }

  for (let i = shots.length - 1; i >= 0; i--) {
    const sp = shots[i];
    sp.vy += sp.g * dt;                                // 살짝 포물선
    sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    const ang = Math.atan2(sp.vy, sp.vx);
    const tx = sp.x + Math.cos(ang) * 24, ty = sp.y + Math.sin(ang) * 24;
    const tip = { l: tx, r: tx, t: ty, b: ty };
    // 몸통 판정은 작게 줄였지만, 창·화살은 넉넉하게 맞도록 여유 22
    const hit = enemies.find(e => !e.dead && enemyHitsBox(e, tip, 22));
    if (hit) { damage(hit, tx, ty); shots.splice(i, 1); continue; }
    if (sp.x > W + 60 || ty > RUN_Y + 6 || sp.y < -80) shots.splice(i, 1);
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    const pp = popups[i];
    pp.life += dt; pp.y -= 38 * dt;
    if (pp.life >= pp.max) popups.splice(i, 1);
  }
}

// 식인 꽃 턱: dir -1 위턱, 1 아래턱. 경첩이 원점, 입은 왼쪽(주인공 쪽)을 향함
function chomperJaw(dir, open) {
  ctx.save();
  ctx.translate(22, 0);
  ctx.rotate(-dir * open);
  ctx.beginPath();
  ctx.moveTo(4, 0);
  ctx.bezierCurveTo(6, dir * 34, -44, dir * 38, -66, dir * 2);
  ctx.lineTo(-62, 0);
  ctx.closePath();
  ctx.fillStyle = linear(0, dir * 36, 0, 0, [[0, '#1f4a34'], [0.6, '#3f7d4f'], [1, '#7a2a5e']]);
  ctx.fill();
  ctx.strokeStyle = 'rgba(10,20,10,0.7)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // 안쪽으로 난 이빨
  ctx.fillStyle = '#f2ead8';
  for (let i = 0; i < 9; i++) {
    const x0 = -60 + i * 6.6;
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 3.3, -dir * (6 + (i % 2) * 3)); ctx.lineTo(x0 + 6.6, 0); ctx.closePath(); ctx.fill();
  }
  // 생체발광 반점
  ctx.save();
  ctx.fillStyle = 'rgba(255,130,235,0.9)';
  ctx.shadowColor = GLOW; ctx.shadowBlur = 6;
  [[-20, 18, 2.2], [-36, 20, 1.8], [-8, 15, 1.6], [-50, 12, 1.4]].forEach(([sx, sy, r]) => {
    ctx.beginPath(); ctx.arc(sx, dir * sy, r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
  ctx.restore();
}

function drawChomper(e) {
  const s = e.s, head = chomperHead(e), d = e.dead ? Math.min(1, e.dead / 0.8) : 0;
  const open = e.dead ? 0.6 : 0.16 + 0.34 * Math.max(0, Math.sin(time * 4.5 + e.seed));   // 덥석덥석
  ctx.save();
  ctx.globalAlpha = 1 - d;
  if (e.flash > 0) ctx.filter = `brightness(${1 + e.flash * 1.4})`;
  ctx.translate(e.x, RUN_Y + 2);
  ctx.scale(s, s);
  const hx = head.sway, hy = -150 + d * 60;            // 쓰러지면 머리가 축 늘어짐

  ctx.save();
  ctx.scale(1, 0.22);
  ctx.fillStyle = radial(0, 0, 0, 60, [[0, 'rgba(0,10,5,0.55)'], [1, 'rgba(0,10,5,0)']]);
  ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 크고 톱니 같은 밑잎
  [-1, 1].forEach(dd => {
    for (let j = 0; j < 4; j++) {
      ctx.beginPath();
      ctx.moveTo(dd * 3, 0);
      ctx.lineTo(dd * (30 + j * 12), -(10 + j * 14));
      ctx.lineTo(dd * 2, -8 - j * 6);
      ctx.closePath();
      ctx.fillStyle = linear(0, 0, dd * 40, -40, [[0, '#0f2e20'], [1, j % 2 ? '#2d7a4c' : '#1f5a3c']]);
      ctx.fill();
    }
  });

  // 굵게 휘어진 줄기
  const stem = () => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-18, -50, 22, -95, hx + 10, hy + 22); };
  ctx.lineCap = 'round';
  stem(); ctx.strokeStyle = '#24502f'; ctx.lineWidth = 15; ctx.stroke();
  stem(); ctx.strokeStyle = 'rgba(110,190,120,0.45)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.save();
  stem(); ctx.setLineDash([2, 10]); ctx.strokeStyle = 'rgba(255,130,235,0.9)'; ctx.lineWidth = 2.4;
  ctx.shadowColor = GLOW; ctx.shadowBlur = 6; ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(d * 1.1);
  // 머리 뒤 가시 꽃잎 테
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 6 + 0.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.25) * 18, Math.sin(a - 0.25) * 18);
    ctx.lineTo(Math.cos(a) * 58, Math.sin(a) * 58);
    ctx.lineTo(Math.cos(a + 0.25) * 18, Math.sin(a + 0.25) * 18);
    ctx.closePath();
    ctx.fillStyle = k % 2 ? '#8a1f6a' : '#c2368f';
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,5,25,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // 입 안
  ctx.fillStyle = radial(-26, 0, 2, 36, [[0, '#ff7ab0'], [0.5, '#9a1240'], [1, '#2a0410']]);
  ctx.beginPath(); ctx.ellipse(-24, 0, 32, 30 * open + 4, 0, 0, Math.PI * 2); ctx.fill();
  chomperJaw(-1, open);
  chomperJaw(1, open);
  ctx.restore();
  ctx.restore();

  if (!e.dead) drawHpBar(e.x + hx * s, RUN_Y + 2 + (hy - 72) * s, e);
}

function drawEnemyBird(e) {
  ctx.save();
  if (e.dead) {
    ctx.globalAlpha = 1 - Math.min(1, e.dead / 0.8);
    ctx.translate(e.x, e.y); ctx.rotate(e.rot); ctx.translate(-e.x, -e.y);
  }
  if (e.flash > 0) ctx.filter = `brightness(${1 + e.flash * 1.4})`;
  drawBird(e);
  ctx.restore();
  if (!e.dead) drawHpBar(e.x, e.y - 50, e);
}

function drawHpBar(x, y, e) {
  const w = 58, h = 6, f = Math.max(0, e.hp / ENEMY_HP);
  ctx.save();
  ctx.fillStyle = 'rgba(10,5,15,0.75)';
  ctx.beginPath(); ctx.roundRect(x - w / 2 - 1.5, y - 1.5, w + 3, h + 3, 4); ctx.fill();
  ctx.fillStyle = linear(x - w / 2, 0, x + w / 2, 0, [[0, '#ff3b5c'], [1, '#ff9a5c']]);
  ctx.beginPath(); ctx.roundRect(x - w / 2, y, w * f, h, 3); ctx.fill();
  ctx.restore();
}

function drawSpear(sp) {
  const ang = Math.atan2(sp.vy, sp.vx);
  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(ang);
  ctx.lineCap = 'round';
  ctx.strokeStyle = linear(-70, 0, -22, 0, [[0, 'rgba(255,120,235,0)'], [1, 'rgba(255,120,235,0.4)']]);
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-70, 0); ctx.lineTo(-22, 0); ctx.stroke();           // 잔상
  ctx.strokeStyle = '#3a2433';
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(18, 0); ctx.stroke();            // 자루
  ctx.fillStyle = '#6f2a88';
  ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-30, -4); ctx.lineTo(-20, 0); ctx.lineTo(-30, 4); ctx.closePath(); ctx.fill();  // 깃털
  ctx.fillStyle = linear(16, -3, 30, 3, [[0, GOLD_D], [0.5, '#ffe3a0'], [1, GOLD]]);
  ctx.shadowColor = GLOW; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(15, -3.4); ctx.lineTo(31, 0); ctx.lineTo(15, 3.4); ctx.closePath(); ctx.fill();  // 금빛 창날
  ctx.restore();
}

function drawPopups() {
  popups.forEach(pp => {
    const t = pp.life / pp.max;
    const size = pp.size * (1 + 0.4 * Math.max(0, 1 - t * 6));   // 뜰 때 톡 튀어나옴
    ctx.save();
    ctx.globalAlpha = 1 - t * t;
    ctx.font = `700 ${size}px "Chakra Petch", "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(20,5,20,0.85)';
    ctx.strokeText(pp.text, pp.x, pp.y);
    ctx.fillStyle = pp.color;
    ctx.fillText(pp.text, pp.x, pp.y);
    ctx.restore();
  });
}

// 2P 화살: 가늘고 빠르며 분홍 깃
function drawArrow(sp) {
  const ang = Math.atan2(sp.vy, sp.vx);
  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(ang);
  ctx.lineCap = 'round';
  ctx.strokeStyle = linear(-60, 0, -18, 0, [[0, 'rgba(255,160,210,0)'], [1, 'rgba(255,160,210,0.4)']]);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-60, 0); ctx.lineTo(-18, 0); ctx.stroke();           // 잔상
  ctx.strokeStyle = '#8a6440';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(20, 0); ctx.stroke();            // 화살대
  ctx.fillStyle = '#ff8fc4';
  [-1, 1].forEach(d => {                                                            // 깃
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-20, d * 4); ctx.lineTo(-17, 0); ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle = '#e8e2d4';
  ctx.shadowColor = '#ff8fc4'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(19, -2.4); ctx.lineTo(28, 0); ctx.lineTo(19, 2.4); ctx.closePath(); ctx.fill();  // 촉
  ctx.restore();
}

// ── 목숨 아이템: 식인 꽃·거대 새를 처치하면 자주 떨어짐 ───────────
const ITEM_DROP_CHANCE = 0.85;   // 자주 나오도록: 처치 10번 중 8~9번
const items = [];

// 하트 모양 경로 (중심 x, y · 크기 s)
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.38);
  ctx.bezierCurveTo(x - s * 0.6, y - s * 0.02, x - s * 0.38, y - s * 0.58, x, y - s * 0.22);
  ctx.bezierCurveTo(x + s * 0.38, y - s * 0.58, x + s * 0.6, y - s * 0.02, x, y + s * 0.38);
  ctx.closePath();
}

// 아이템은 주인공들이 서 있는 높이로 내려와 땅과 함께 흘러오고, 닿으면 획득
function updateItems(dt, v) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.t += dt;
    it.x -= v * dt;
    it.y += (RUN_Y - 62 - it.y) * Math.min(1, dt * 2.5);
    const taker = players.find(p => p.alive && circleHitsBox(it.x, it.y, 16, playerBox(p)));
    if (taker) { collectItem(it); items.splice(i, 1); continue; }
    if (it.x < -40) items.splice(i, 1);
  }
}

function collectItem(it) {
  const out = players.find(p => !p.alive);
  if (out) {
    revive(out);                                       // 아웃된 친구를 살림
  } else if (lives < MAX_LIVES) {
    lives++;                                           // 둘 다 살아 있으면 하트 +1
    heartGain = 1;
    addPopup(it.x, it.y - 24, '+♥ 목숨 추가!', '#ff8fb8', 18);
  } else {
    score += 100;                                      // 하트가 가득 차 있으면 보너스 점수
    addPopup(it.x, it.y - 24, '♥ 가득! +100', '#ffd36b', 16);
  }
  puff(10, 1, it.y, it.x);
}

function drawItem(it) {
  const x = it.x, y = it.y + Math.sin(it.t * 4) * 4;
  const s = 22 * (1 + Math.sin(it.t * 6) * 0.08);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = radial(x, y, 0, 30, [[0, 'rgba(255,90,150,0.5)'], [1, 'rgba(255,90,150,0)']]);
  ctx.fillRect(x - 30, y - 30, 60, 60);
  ctx.globalCompositeOperation = 'source-over';
  for (let k = 0; k < 3; k++) {                        // 주위를 도는 반짝임
    const a = it.t * 2.4 + k * Math.PI * 2 / 3;
    sparkle(x + Math.cos(a) * 19, y + Math.sin(a) * 12, 2.6);
  }
  heartPath(x, y, s);
  ctx.fillStyle = linear(x, y - s * 0.5, x, y + s * 0.4, [[0, '#ffb3cf'], [0.5, '#ff4f8a'], [1, '#b8164a']]);
  ctx.shadowColor = '#ff5fa0'; ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,240,248,0.85)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.ellipse(x - s * 0.2, y - s * 0.22, s * 0.1, s * 0.06, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 우측 상단 점수판 아래의 하트 줄
function drawHearts() {
  const slots = Math.max(START_LIVES, lives), gap = 27, size = 22;
  const right = W - 24, y = 22 + 78 + 22;
  const w = slots * gap + 14, left = right - w;
  const shake = heartLose * Math.sin(time * 60) * 3;
  ctx.save();
  ctx.fillStyle = 'rgba(10,12,26,0.5)';
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(left, y - 16, w, 32, 16); ctx.fill(); ctx.stroke();
  for (let j = 0; j < slots; j++) {
    const x = left + 7 + gap / 2 + j * gap + shake;
    const full = j < lives;
    const pop = full && j === lives - 1 ? heartGain : 0;           // 방금 얻은 하트는 톡 커짐
    const s = size * (1 + pop * 0.6);
    heartPath(x, y + 2, s);
    if (full) {
      ctx.fillStyle = linear(x, y - s * 0.5, x, y + s * 0.4, [[0, '#ffb3cf'], [0.5, '#ff4f8a'], [1, '#c41a52']]);
      ctx.shadowColor = '#ff5fa0'; ctx.shadowBlur = 6 + pop * 18;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.ellipse(x - s * 0.2, y + 2 - s * 0.22, s * 0.09, s * 0.055, -0.6, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,170,200,0.45)';                  // 잃은 자리는 빈 하트
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawCombat() {
  items.forEach(drawItem);
  enemies.forEach(e => (e.type === 'chomper' ? drawChomper(e) : drawEnemyBird(e)));
  shots.forEach(sp => (sp.kind === 'arrow' ? drawArrow(sp) : drawSpear(sp)));
}

// ── 렌더 ─────────────────────────────────────────────────
// 흘러가는 배경 층: 땅은 장애물과 같은 속도(1), 숲은 멀수록 느리게
const LAYERS = [
  { draw: drawForestFar, rate: 0.08 },
  { draw: drawForestMid, rate: 0.22 },
  { draw: drawForestNear, rate: 0.45 },
  { draw: drawGround, rate: 1 },
].map(l => {
  const c = document.createElement('canvas');
  return { ...l, canvas: c, ctx: c.getContext('2d') };
});

function buildBackground() {
  const sx = canvas.width / W, sy = canvas.height / H;
  bg.width = canvas.width;
  bg.height = canvas.height;
  ctx = bgCtx;
  ctx.setTransform(sx, 0, 0, sy, 0, 0);
  drawSky();
  drawGasGiant();
  drawClouds();
  drawScenery();

  // 각 층을 화면 폭만큼의 타일로 그림. 좌우 복사본까지 그려 이어 붙여도 이음매가 없음
  LAYERS.forEach(l => {
    l.canvas.width = canvas.width;
    l.canvas.height = canvas.height;
    ctx = l.ctx;
    for (const dx of [-W, 0, W]) {
      ctx.setTransform(sx, 0, 0, sy, dx * sx, 0);
      l.draw();
    }
  });
  ctx = mainCtx;
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  LAYERS.forEach(l => {
    const off = Math.round(((scrollX * l.rate) % W) * canvas.width / W);
    ctx.drawImage(l.canvas, -off, 0);
    ctx.drawImage(l.canvas, canvas.width - off, 0);
  });
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);

  drawBirds();
  drawObstacles();
  drawCombat();
  drawDust();
  [...players].sort((a, b) => a.x - b.x).forEach(drawPlayer);   // 뒤쪽 캐릭터부터
  drawVignette();
  drawPopups();
  if (state === 'playing') drawHint();
  drawScore(Math.floor(score), best);
  drawHearts();
}

function drawPlayer(p) {
  // 이륙·낙하 중엔 살짝 늘어나고, 착지 순간엔 살짝 눌림
  const stretch = p.onGround ? 0 : Math.min(Math.abs(p.vy) / JUMP_V, 1) * 0.07;
  const squash = p.land * 0.1;
  const run = p.runAmt;
  const draw = p.id === 0 ? drawAlien : drawPinkGirl;

  ctx.save();
  if (!p.alive) ctx.filter = `grayscale(0.85) opacity(${Math.max(0.3, 1 - p.deadT * 2)})`;   // 아웃되면 흐릿하게
  else if (p.inv > 0 && Math.sin(time * 30) > 0) ctx.filter = 'opacity(0.35)';                // 무적 중엔 깜빡임
  draw(p.x, RUN_Y, 1, {
    base: mixPose(POSE.stand, runPose(p.runPh), run),
    bob: 2.2 * Math.abs(Math.cos(p.runPh)) * run,       // 한 발로 디딜 때 살짝 내려앉음
    sway: (0.12 + 0.1 * Math.sin(p.runPh * 2)) * run,    // 머리·망토가 리듬에 맞춰 들썩임
    throw: Math.sin(Math.min(1, p.throwT) * Math.PI / 2), // 창·활을 쏠 때 팔을 앞으로 쭉 뻗음
    height: p.height,
    vy: p.vy,
    pose: p.pose,
    sx: 1 - stretch * 0.6 + squash * 0.8,
    sy: 1 + stretch - squash,
  });
  ctx.restore();

  // 머리 위 1P / 2P 이름표
  const ty = RUN_Y - p.height - 138;
  ctx.save();
  ctx.globalAlpha = p.alive ? 0.95 : 0.4;
  ctx.font = '700 11px "Chakra Petch", "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  const label = p.alive ? p.label : `${p.label} OUT`;
  const w = ctx.measureText(label).width + 12;
  ctx.fillStyle = 'rgba(12,8,22,0.6)';
  ctx.beginPath(); ctx.roundRect(p.x - w / 2, ty - 11, w, 15, 7); ctx.fill();
  ctx.fillStyle = p.color;
  ctx.fillText(label, p.x, ty);
  ctx.beginPath(); ctx.moveTo(p.x - 3, ty + 4); ctx.lineTo(p.x + 3, ty + 4); ctx.lineTo(p.x, ty + 7); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  buildBackground();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// ── 입력 ─────────────────────────────────────────────────
// 1P 보라빛 나비족 소녀: Space 점프 · W 창 (정면으로)
window.addEventListener('keydown', e => {
  if (state !== 'playing') return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) jump(players[0]);
  } else if (e.code === 'KeyW') {
    if (!e.repeat) shootForward(players[0]);
  }
});
// 2P 분홍빛 나비 소녀: 좌클릭 점프 · 우클릭 화살 (마우스 커서 쪽으로)
// 게임 오버 화면의 "다시 하기" 클릭은 jump()/shoot()이 state 검사로 무시함
canvas.addEventListener('pointerdown', e => {
  if (e.button === 0) {
    e.preventDefault();
    jump(players[1]);
  } else if (e.button === 2) {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    shoot(players[1], (e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());   // 우클릭 메뉴 막기

window.addEventListener('resize', resize);
resize();
document.fonts.load('700 32px "Chakra Petch"').catch(() => {});
document.fonts.load('600 10px Inter').catch(() => {});
requestAnimationFrame(frame);
</script>
</body>
</html>
